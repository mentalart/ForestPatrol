<title>Златая цепь — Пролог, Мир 1 и Мир 2 (3D greybox)</title>
<!--
==========================================================================================
 ЗЛАТАЯ ЦЕПЬ — глава «0 · Пролог. Звенышко», «Мир 1 · Дремучий лес» (5 уровней, босс, Сказ, ролик
 «Голос») и «Мир 2 · Подводный Китеж» (5 уровней, босс Водяной, Сказ 2), играбельный 3D greybox (кооп на двоих: одна клавиатура и/или два джойстика). Собран по
 сценарию v4 на движке вертикального среза (index_2.html): стек, камера, деление экрана, герои-примитивы.
 Состав:
  0  Пролог «Звенышко»: Штаб-сосна -> «Колыбельная» -> погоня (Смена) -> калитка (свой приём) -> плиты
     («оставленный держит»; лесенка — по кнопке Прошки) -> первый морок -> дупло -> «Лукоморье».
     Лукоморье: карта-рушник — ролик «Пять миров»: Звенышко ныряет в Мир 1 и затягивает героев.
  1-1 «Избушка, повернись»: пеньки «на раз-два-три», кикиморки, клубок-путеводитель, нить к нити, подкидка.
  1-2 «Кикиморино болото»: струна на колышке (висит, пока не смотаешь RB там, откуда бросил), высокая
      струна (съезжают, повиснув), толстая струна Потапа (ловушка: обернулся — струна в ряску), кувырок, пни.
  1-3 «Колобок»: гусельный раннер на 96 ударов — три дорожки у каждого игрока, коряги, пни, низкие ветки,
      овражки, ряды искр, комбо «Лад», пять этапов; финал — пляска на гуслях: четыре струны зажигаются,
      когда оба прыгают в одну долю.
  1-4 «Леший водит»: шапки из мха (Прошка отказывается сам), ходячие ёлки и луч светлячка, Пелагею
      уводят в кольцо (кинематографичный ролик; она смотрит и оттуда), ель-замок: ковшик Йоши + три
      замка-шишки для рогатки Прошки (каждая — со своего следа), оставленный
      сторожит, ель привязывается клубком у колышка, Совиный взор и нить по серебряной тропе, лешачата.
  1-5 «Кикиморина прялка»: паутинки крест-накрест, контуры героев в кольцах и дуги прыжка, паутинка сама
      несёт на следующий этаж; тянущая прялка (жёлудь в веретено / старая нить Совиным взором); овин с лучами
      из окон, лунным окном, пылью и нитями от прялки; пять нитяных мороков на чердаке.
  1-Б «Леший-Путаник»: руки-коряги (рука в Пробое — мостик на плечо), двойники и струна по ногам,
      карусель: Богатырский щит, богатырский выход, Богатырский мах вдвоём. Ворота — 12 звеньев мира,
      кузня Кузьмы («Не лупи. Слушай металл.»).
  Лукоморье-хаб: карта-рушник (выбор уровня, звенья, орешки, пряники, вышитая карта тайников), кузня
  (сдать звенья — три удара в такт с Кузьмой; лишние звенья — в звоночки), дуб-градусник (зеленеет от
  скованных звеньев, Кот сидит на цепи), лавка Векши за орешки (наряды, пляска «Барыня», фоторежим
  «Лубок», украшения), сказки-лубки Кота и пляска Кота на цепи за звоночки, Сказ 1, праздник и «Голос».
  В мирах Звенышко улетает вперёд и появляется, только когда нужно (подсказка, реплика, ролик).
 МИР 2 · ПОДВОДНЫЙ КИТЕЖ (гусли Садко, RB: прилив ↔ отлив на участке с раковиной, 2 с, герой всё время идёт):
  2-1 «Гусли Садко»: струна Садко (мёртвая вода), запрет «не молчи» трижды, фонтан, ролик «Пустая книга»
      («Не про меня», зонт из лопуха), лодки до крыш, подвалы с орешками, дом-колодец-лифт, щуки-мороки.
  2-2 «Чудо-юдо Рыба-кит»: одна вода на двоих — просьба (значок и 2 секунды, второй закон дивана),
      двор → огород и мачта → фонтан-дыхание кита до облаков, раки-щипачи; Потап забыл былину.
  2-3 «Невод» (на четверых, общий экран): камни со знаком клубка, невод из нитей, углы держат стоящие
      на камнях (меньше трёх — провисает), сундук, невод-мост над течением, рыбка по цифрам; зов.
  2-4 «В брюхе у кита» (экран разделён, асимметрия): корабль и прибывающая вода у Игрока 1, Йоша один
      у Игрока 2, пять связок через стенку кита, «Прошка! Позвони в колокол! Пожалуйста!», тинники.
  2-5 «Китеж звонит»: колокола на разной глубине, скриптованное молчание Пелагеи, спуск отливом,
      одиночные и двойная звонницы, город растёт под ногами, пузырники, широкий щит, главный колокол, «Бом».
  2-Б «Водяной»: омут (прилив — отбивы, отлив — ракушки сбоку), течение (вода на половинах разная),
      замах пузырём (рогатка) и Богатырский мах; Кощей на скале; колокола Китежа убаюкивают.
  Хаб мира 2: вступление Пелагеи по тетрадке и пантомима Кота, рушник по мирам, кузня (Кузьма правит
  только последний удар), сцена перед Водяным, лубки мира 2, весточка помощника, Сказ 2 шёпотом, второй виток.
 В меню можно начать с любого уровня (стрелки / A D / крестовина).
 Стек:   один HTML + Three.js r128 с CDN. Никаких других зависимостей.

 ЧТО ВЗЯТО ИЗ СЦЕНАРИЯ v4:
  - Раскладка джойстика: A прыжок · B защита · X удар · Y смена · RT свой приём · RB клубок · LT кувырок ·
    крестовина ↑ «Ко мне!». Клавиатура: Игрок 1 WASD/Пробел/F/G/Q/E/R/Shift/1, Игрок 2 стрелки/M/,/./K/L/;/«/»/0.
  - Бой: запал — угольки ГАСНУТ; одна кнопка защиты: щит → отбив → «Одним махом»; жёлтый / красный
    (только кувырок) / синий (капля — отбить обратно); скорлупа слетает с той стороны, откуда удар;
    искры жуют мороки; синяя шкала — богатырский выход; огромный Пробой бьют вдвоём.
  - Три пути сложности у каждого игрока; закон щедрого окна (в общих действиях — окно лучшего).
  - Каждое действие впервые показывается рисунком кнопки над тем героем, которому оно нужно.
  - Подсказчик — Звенышко (в игре не пиликает: дрожит и пускает волны; звенит только в роликах).
  - Ролики с пропуском (оба держат A). Субтитры отключаемы. Полупрозрачность того, что заслоняет героев.
  - «Держись за меня», колокольчики, падения без урона, лепестки и подшивание (закон доброго дивана).

 ИЗВЕСТНЫЕ ОГРАНИЧЕНИЯ / ЗАГЛУШКИ:
  - Весь арт — примитивы Three.js (Lambert), без текстур и скелетной анимации; анимация процедурная.
  - Озвучки нет: голоса — «бормотание» тонами AudioContext; колыбельная и «Ах вы, сени» — синтез-заглушки.
  - Уровни короче бюджета сценария (≈ 5–8 минут вместо 12–13); узелки, сохранения, испытания Заставы
    и одиночный вариант асимметричной сцены 2-4 — не входят. Миры 3–5 на карте — «скоро».
  - Физика — AABB/цилиндры и наклонный мостик-рука; потолок учитывается только для прыжка.
 Отладка: объект window.ZC — только для тестов, в релизе убрать.
==========================================================================================
-->

function collideXZ(x,z,r,feet,top,skipMovers){let hit=false;

   else{const pl=x-b.minx,pr=b.maxx-x,pb=z-b.minz,pf=b.maxz-z,m=Math.min(pl,pr,pb,pf);if(m===pl)x=b.minx-r;else if(m===pr)x=b.maxx+r;else if(m===pb)z=b.minz-r;else z=b.maxz+r;}}

function groundAt(x,z,reach,m,hh,noWater){m=m===undefined?0.12:m;let y=-1e9,ref=null;

  for(const c of W.cyls){if(!c.on||c.maxy>reach)continue;const dx=x-c.x,dz=z-c.z;if(dx*dx+dz*dz>(c.r+m)*(c.r+m))continue;if(c.maxy>y){y=c.maxy;ref=c;}}

  for(const t of W.threads){if(t.len<=0.3||t.ret)continue;if(t.sag&&!(hh&&t.sagOn&&t.sagOn.includes(hh)))continue;const px=x-t.sx,pz=z-t.sz,u=px*t.dx+pz*t.dz;if(u<(t.string?0.05:-0.4)||u>t.len+0.25)continue;
    if(Math.abs(px*t.dz-pz*t.dx)>(t.thick?1.0:t.glued?0.95:0.62))continue;const ty=thY(t,u);if(ty>reach)continue;if(ty>y){y=ty;ref=t;}}
  // вода участка (гусли): гладь держит плывущего; кто оказался чуть ниже глади — всплывает на неё
  if(!noWater)for(const w of W.waters){if(w.level<=w.floor+0.05)continue;if(x<w.minx-m||x>w.maxx+m||z<w.minz-m||z>w.maxz+m)continue;
    const under=hh&&hh.pos.y<w.level&&hh.pos.y>w.level-1.6;if((w.level<=reach||under)&&w.level>y){y=w.level;ref=w;}}
  for(const f of W.surfs){const r=f(x,z,reach,hh);if(r&&r.y<=reach+0.001&&r.y>y){y=r.y;ref=r.ref;}}
  return {y,ref};}
// потолок над головой (для прыжка в низком лазе): самый низкий низ коробки выше макушки

function segBox(p,q,b){let t0=0,t1=1;const d=[q.x-p.x,q.y-p.y,q.z-p.z],o=[p.x,p.y,p.z],mn=[b.minx,b.miny,b.minz],mx=[b.maxx,b.maxy,b.maxz];

function moveHero(h,dt,wx,wz,speed){const k=h.grounded?12:4.5;h.vel.x=damp(h.vel.x,wx*speed,k,dt);h.vel.z=damp(h.vel.z,wz*speed,k,dt);}

  if(h.active)for(const t of W.hittables){if(!t.push||!t.alive())continue;const dx=h.pos.x-t.pos.x,dz=h.pos.z-t.pos.z,d=Math.hypot(dx,dz),rr=r+t.r;if(d<rr&&d>1e-4){h.pos.x=t.pos.x+dx/d*rr;h.pos.z=t.pos.z+dz/d*rr;}}

    if(g.ref&&g.ref.string&&landed&&W.webs.some(w=>Math.hypot(w.x-h.pos.x,w.z-h.pos.z)<1.45&&Math.abs(w.y-g.y)<0.7)){ny=g.y+0.02;h.vel.y=14.2;h.grounded=false;h.groundRef=null;h.hang=false;SFX.toss();
      floatText(h.pos.clone().add(new V3(0,h.d.height+0.4,0)),'Паутинка!','#fff2b0');if(W.onWeb)W.onWeb(h);}

  else{h.grounded=false;h.groundRef=null;}
  h.pos.y=ny;if(h.active&&h.grounded&&!(h.groundRef&&(h.groundRef.string||h.groundRef.water||h.groundRef.net))&&h.pos.y>(W.fallY||-9)+2){if(!h.safe)h.safe=new V3();if(!h.safeT||G.time-h.safeT>0.5){h.safeT=G.time;h.safe.copy(h.pos);}}

      '<br><span style="opacity:.8">Водяного убаюкали колокола Китежа. Йоша научился просить, Прошка молча отдал Пелагее звено, а Пелагея впервые рассказала Сказ сама — шёпотом. Второй виток на дубе. Дальше по сценарию — Мир 3 «Небесное царство».</span></div><div class="go">Enter или Start — вернуться на Лукоморье</div>';}
  if(mode==='end'&&G.flags.voiceDone){const s=G.stats,m=Math.floor(G.playTime/60),sec=Math.floor(G.playTime%60),nuts=W1.reduce((a,id)=>a+(G.nutsGot[id]||0),0),t=G.flags.skaz;
    return top+'<h2 style="color:#ffc93c">Мир 1 «Дремучий лес» пройден!</h2><div class="res">Звенья мира: '+worldLinks()+' / 19 · Орешки: '+nuts+' / 23 · Время: '+m+' мин '+sec+' с'+(s.skips?' · пропущено роликов: '+s.skips:'')+
      (t?'<br>Сказ «Леший-проводник»: <i>'+t[0]+'. И помог им '+t[1].replace(/^./,c=>c.toLowerCase())+'. '+t[2]+'.</i>':'')+
      '<br>Щитов: '+s.shields+' · Отбивов: '+s.parries+' · «Одним махом»: '+s.mahs+' · Добивающих махов: '+s.finishers+' · Богатырских махов: '+s.bogatyr+' · Нитей склеено: '+s.glue+
      '<br>Смен героя: '+s.swaps+' · Падений (без урона): '+s.falls+' · Подшили друга: '+s.revives+' · Звенышко подтянуло оставленных: '+s.carries+
      '<br><span style="opacity:.8">Кощей унёс голос Кота. Кот теперь мяукает, а следующие Сказы рассказывает Пелагея. На карте-рушнике открылся Мир 2 «Подводный Китеж».</span></div><div class="go">Enter или Start — вернуться на Лукоморье</div>';}
  if(mode==='end'){const s=G.stats,m=Math.floor(G.playTime/60),sec=Math.floor(G.playTime%60);
    return top+'<h2 style="color:#ffc93c">Пролог пройден! Звенья: '+Math.max(1,G.links)+' (Звенышко)</h2><div class="res">Время: '+m+' мин '+sec+' с'+(s.skips?' · пропущено роликов: '+s.skips:'')+
      '<br>Щитов: '+s.shields+' · Отбивов: '+s.parries+' · «Одним махом»: '+s.mahs+' · Добивающих махов: '+s.finishers+' · Искр собрано: '+s.sparks+
      '<br>Смен героя: '+s.swaps+' · Падений (без урона): '+s.falls+' · «Держись за меня»: '+s.clings+' · Звенышко подтянуло оставленных: '+s.carries+
      '<br><span style="opacity:.8">Дальше по сценарию — Мир 1 «Дремучий лес», уровень 1-1 «Избушка, повернись» (он есть в вертикальном срезе).</span></div><div class="go">Enter или Start — сыграть снова</div>';}
  const padRows=[[STICK,'Ходьба'],[padGlyph('jump'),'Прыжок (держать — планировать)'],[padGlyph('swap'),'Смена героя'],[padGlyph('skill'),'Свой приём'],[padGlyph('guard'),'Защита'],[padGlyph('attack'),'Удар'],
    [padGlyph('call'),'«Ко мне!»'],['<span class="pb T">Start</span>','Пауза / начать'],[padGlyph('item')+padGlyph('roll'),'<span style="opacity:.5">Чудо-вещь: клубок / гусли · Кувырок (1-2)</span>']];
  const padCol='<div class="col" style="border:3px solid #56607a;margin-top:14px"><h2>Джойстики · раскладка по сценарию v4 (Xbox / PlayStation)</h2><div class="padgrid">'+padRows.map(r=>'<div>'+r[0]+' '+r[1]+'</div>').join('')+'</div><div style="margin-top:8px;font-size:13px;opacity:.85">'+padStatus()+'</div></div>';
  const pbtn=pi=>{const p=players[pi];return '<button id="e'+pi+'" class="'+p.path+'">Игрок '+(pi+1)+': '+PATHNAME[p.path]+' <kbd>'+(pi?'K':'Q')+'</kbd></button>';};
  return top+(mode==='pause'&&W&&W.pauseLine?'<div class="legend"><div style="flex:1"><b>Что мы делаем:</b> '+W.pauseLine+'</div></div>':'')+'<div class="cols">'+col(0)+col(1)+'</div>'+padCol+
   '<div class="legend"><div><i class="sg y"></i> солнышко над мороком — Защита: раньше — щит, позже — отбив, в самый миг — «Одним махом»</div><div>угольки <i class="sg e"></i> погасли — Пробой → Удар: Добивающий мах</div>'+
   '<div><i class="sg o"></i> жёлтая плита с лапкой — встать любому; ворота открыты, пока плиту держат</div><div>над героем картинка кнопки — жми её этим героем</div><div>ролик: оба держат прыжок — пропуск</div></div>'+
   '<div class="diff">'+pbtn(0)+pbtn(1)+'<button id="subsb">Субтитры: '+(G.subs?'вкл':'выкл')+' <kbd>C</kbd></button></div>'+
   (mode==='menu'?'<div class="lvsel"><button id="lvp">‹</button><span class="nm">Начать с: '+LEVELS[G.startIdx||0].name+'</span><button id="lvn">›</button></div><div style="text-align:center;font-size:13px;opacity:.7">выбор уровня — <kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> / крестовина</div>':'')+
   '<div class="go">'+(mode==='pause'?'Enter / Esc / Start — продолжить':'Enter или Start — начать')+'</div>';}
function cyclePath(pi){const p=players[pi];p.path=PATHS[(PATHS.indexOf(p.path)+1)%3];}
function showMenu(mode){G.state=mode;const card=$('card');card.innerHTML=menuHTML(mode);$('menu').classList.remove('hide');
  for(const pi of[0,1]){const b=$('e'+pi);if(b)b.onclick=()=>{cyclePath(pi);showMenu(mode);};}const sb=$('subsb');if(sb)sb.onclick=()=>{G.subs=!G.subs;showMenu(mode);};
  const lp=$('lvp'),ln=$('lvn');if(lp)lp.onclick=()=>{pickLevel(-1);};if(ln)ln.onclick=()=>{pickLevel(1);};}
function pickLevel(d){G.startIdx=((G.startIdx||0)+d+LEVELS.length)%LEVELS.length;SFX.swap();showMenu('menu');}
// начать с любого уровня: всё, что раньше, считается пройденным со всеми звеньями
function startFrom(i){for(const k in G.stats)G.stats[k]=0;G.playTime=0;G.links=0;G.flags={};G.done={};G.got={};G.nutsGot={};G.forgedLinks=0;G.forgedW={1:0,2:0};G.bellsSpent=0;G.nutsSpent=0;G.owned={};G.secrets={};G.sparksLv={};G.tales={};document.body.classList.remove('photo');
  players.forEach(p=>{p.enc={};p.shieldTaught=false;p.closedTaught=false;p.staggerSeen=0;p.blue=0;p.act=0;});
  const L=LEVELS[i];G.hub=i>=LV('1-1');if(i>=LV('luko'))G.links=1;if(i>LV('luko'))G.flags.map1=true;
  LEVELS.forEach((l,k)=>{if(l.world&&!l.boss&&k<i){G.done[l.id]=true;G.got[l.id]=l.links;G.nutsGot[l.id]=l.nuts;}});
  if(i>LV('1-B')){G.done['1-B']=true;G.flags.forged=true;G.flags.voiceDone=true;G.flags.coils=1;G.flags.w2intro=true;G.flags.map2=true;G.forgedW[1]=19;G.flags.skaz=['Жили-были звери в лесу','Леший со светлячком','И Леший стал показывать дорогу'];}
  if(L.boss){if(L.world===2){G.flags.forged2=true;G.forgedW[2]=12;}else{G.flags.forged=true;G.forgedW[1]=12;}}
  G.forgedLinks=G.forgedW[1]+G.forgedW[2];loadLevel(i);hideMenu();}
function showTitle(){const lv=$('level');lv.innerHTML=W.name+'<br><span style="font-size:18px;font-weight:600;opacity:.85">'+W.sub+'</span>';lv.style.opacity=1;clearTimeout(showTitle.t);showTitle.t=setTimeout(()=>{lv.style.opacity=0;},3600);}
function hideMenu(){const first=G.state!=='pause';$('menu').classList.add('hide');G.state='play';initAudio();if(first)showTitle();}
function endGame(){showMenu('end');}
function restart(){startFrom(0);}
function menuInput(){if(G.state==='end'){if(pressed.has('Enter')){if(G.flags.voiceDone){$('menu').classList.add('hide');G.state='play';}else restart();}return;}
  if(G.state==='menu'){const a=uiNav(0),b=uiNav(1),d=a.dx||b.dx;if(d||pressed.has('ArrowLeft')&&!d||pressed.has('ArrowRight')&&!d){pickLevel(d||(pressed.has('ArrowLeft')?-1:1));return;}
    if(pressed.has('Enter')){const i=G.startIdx||0;if(i===0&&W.levelId==='p'&&!G.playTime)hideMenu();else startFrom(i);return;}}
  if(pressed.has('Tab')||pressed.has('PadBack')){PADS.swap=!PADS.swap;showMenu(G.state);}if(pressed.has('KeyQ')){cyclePath(0);showMenu(G.state);}if(pressed.has('KeyK')){cyclePath(1);showMenu(G.state);}
  if(pressed.has('KeyC')){G.subs=!G.subs;showMenu(G.state);}
  if(pressed.has('Enter')||(G.state==='pause'&&pressed.has('Escape')))hideMenu();}
let last=performance.now();
function frame(now){requestAnimationFrame(frame);let dt=Math.min(0.05,(now-last)/1000);last=now;pollPads();
  if(G.state==='play'&&(pressed.has('KeyP')||pressed.has('PadBack')))togglePhoto();
  if(G.state==='play'&&G.manual){}else if(G.state==='play'){if(pressed.has('Escape')){showMenu('pause');}else{if(G.hitstop>0){G.hitstop-=dt;dt*=0.15;}step(dt);}}else menuInput();
  render();updateUI(Math.min(0.05,G.state==='play'?dt:0));pressed.clear();}
hudInit();loadLevel(0);showMenu('menu');requestAnimationFrame(frame);
window.ZC={G,players,loadLevel,HERO,get W(){return W;},step,completeLevel,finishLevel,goLevel,startFrom,LEVELS,LV,worldLinks,
  sim(sec){const n=Math.round(sec*60);for(let i=0;i<n;i++){if(G.state!=='play')break;step(1/60);if(i%30===0)updateUI(1/60);pressed.clear();}render();updateUI(1/60);},
  start(){hideMenu();},menu:showMenu,tick(n){for(let i=0;i<(n||1);i++){step(1/60);pressed.clear();}},press(c){pressed.add(c);},hold(c,on){if(on)down.add(c);else down.delete(c);},skip(){if(G.cine){G.cine.skip();G.cine.t=G.cine.dur;}}};
})();
</script>
