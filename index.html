<title>Златая цепь — Пролог и Мир 1 «Дремучий лес» (3D greybox)</title>
<!--
==========================================================================================
 ЗЛАТАЯ ЦЕПЬ — глава «0 · Пролог. Звенышко» и «Мир 1 · Дремучий лес» (5 уровней, босс, Сказ, ролик
 «Голос»), играбельный 3D greybox (кооп на двоих: одна клавиатура и/или два джойстика). Собран по
 сценарию v4 на движке вертикального среза (index_2.html): стек, камера, деление экрана, герои-примитивы.
 Состав:
  0  Пролог «Звенышко»: Штаб-сосна -> «Колыбельная» -> погоня (Смена) -> калитка (свой приём) -> плиты
     («оставленный держит»; лесенка — по кнопке Прошки) -> первый морок -> дупло -> «Лукоморье».
     Лукоморье: карта-рушник — ролик «Пять миров»: Звенышко ныряет в Мир 1 и затягивает героев.
  1-1 «Избушка, повернись»: пеньки «на раз-два-три», кикиморки, клубок-путеводитель, нить к нити, подкидка.
  1-2 «Кикиморино болото»: струна на колышке, высокая струна (съезжают, повиснув), толстая струна
      Потапа (ловушка: обернулся — струна в ряску), кувырок, пни-ворчуны в коре.
  1-3 «Колобок»: гусельный уровень, 96 ударов, бубенец-метроном, струны в долю, звери в припеве,
      режим «Лад» (фраза повторяется, пока звенья ждут), «последние четыре доли — вместе».
  1-4 «Леший водит»: шапки из мха (Прошка отказывается сам), ходячие ёлки и луч светлячка, Пелагею
      уводят в кольцо (она смотрит и оттуда), ель-замок: ковшик Йоши + рогатка Прошки, оставленный
      сторожит, ель привязывается клубком у колышка, Совиный взор и нить по серебряной тропе, лешачата.
  1-5 «Кикиморина прялка»: паутинки крест-накрест (держат двое — прыгают двое), этажи овина,
      тянущая прялка (жёлудь в веретено / старая нить Совиным взором), пять нитяных мороков на чердаке.
  1-Б «Леший-Путаник»: руки-коряги (рука в Пробое — мостик на плечо), двойники и струна по ногам,
      карусель: Богатырский щит, богатырский выход, Богатырский мах вдвоём. Ворота — 12 звеньев мира,
      кузня Кузьмы («Не лупи. Слушай металл.»).
  Лукоморье-хаб: карта-рушник (выбор уровня, звенья и орешки), кузня, Сказ 1 (начало / помощник /
  конец — вдвоём), праздник, первый виток и ролик «Голос» (Кощей снимает голос с Кота).
 В меню можно начать с любого уровня (стрелки / A D / крестовина).
 Стек:   один HTML + Three.js r128 с CDN. Никаких других зависимостей.

 ЧТО ВЗЯТО ИЗ СЦЕНАРИЯ v4:
  - Раскладка джойстика: A прыжок · B защита · X удар · Y смена · RT свой приём · RB клубок · LT кувырок ·
    крестовина ↑ «Ко мне!». Клавиатура: Игрок 1 WASD/Пробел/F/G/Q/E/R/Shift/1, Игрок 2 стрелки/M/,/./K/L/;/«/»/0.
  - Бой: запал — угольки ГАСНУТ; одна кнопка защиты: щит → отбив → «Одним махом»; жёлтый / красный
    (только кувырок) / синий (капля — отбить обратно); скорлупа слетает с той стороны, откуда удар;
    искры жуют мороки; синяя шкала — богатырский выход; огромный Пробой бьют вдвоём.
  - Три пути сложности у каждого игрока; закон щедрого окна (в общих действиях — окно лучшего).
  - Каждое действие впервые показывается рисунком кнопки над тем героем, которому оно нужно.
  - Подсказчик — Звенышко (в игре не пиликает: дрожит и пускает волны; звенит только в роликах).
  - Ролики с пропуском (оба держат A). Субтитры отключаемы. Полупрозрачность того, что заслоняет героев.
  - «Держись за меня», колокольчики, падения без урона, лепестки и подшивание (закон доброго дивана).

 ИЗВЕСТНЫЕ ОГРАНИЧЕНИЯ / ЗАГЛУШКИ:
  - Весь арт — примитивы Three.js (Lambert), без текстур и скелетной анимации; анимация процедурная.
  - Озвучки нет: голоса — «бормотание» тонами AudioContext; колыбельная и «Ах вы, сени» — синтез-заглушки.
  - Уровни короче бюджета сценария (≈ 5–8 минут вместо 12–13); узелки, лавка Векши, звоночки, пряники,
    весточка помощника и сохранения — не входят. Миры 2–5 на карте — «скоро».
  - Физика — AABB/цилиндры и наклонный мостик-рука; потолок учитывается только для прыжка.
 Отладка: объект window.ZC — только для тестов, в релизе убрать.
==========================================================================================
-->

  list.sort((a,b)=>a.index-b.index);const nd=new Set();PADS.gp=[null,null];

    const bt=i=>{const b=gp.buttons&&gp.buttons[i];return !!b&&(b.pressed||b.value>0.5);};

function fadeable(obj){if(!obj)return null;const f={mats:[],k:1,hit:false};

    if(mat.userData.shared||(own&&own!==f)){mat=mat.clone();mat.userData.shared=false;m.material=mat;}
    if(mat.userData.baseOp===undefined)mat.userData.baseOp=mat.transparent?mat.opacity:1;
    W.fadeOwner.set(mat,f);if(f.mats.indexOf(mat)<0)f.mats.push(mat);m.userData.fadeRef=f;W.fadeMeshes.push(m);});
  W.fades.push(f);return f;}

  if(!G.cine){const views=G.split>0.5?[[rigs[0].pos,[active(0)]],[rigs[1].pos,[active(1)]]]:[[shared.pos,[active(0),active(1)]]];
    for(const[cp,hs]of views)for(const h of hs){const tgt=new V3(h.pos.x,h.pos.y+heroHeight(h)*0.6,h.pos.z),dir=tgt.clone().sub(cp),d=dir.length();if(d<0.6)continue;dir.divideScalar(d);

  for(const f of W.fades){const tk=f.hit?0.22:1;if(f.k===tk)continue;f.k=damp(f.k,tk,9,dt);if(Math.abs(f.k-tk)<0.01)f.k=tk;
    for(const m of f.mats){m.opacity=f.k*m.userData.baseOp;m.transparent=m.opacity<0.99;m.depthWrite=f.k>=0.99;}}}

function collideXZ(x,z,r,feet,top,skipMovers){let hit=false;
  for(const b of W.boxes){if(!b.on||b.maxy<=feet+STEP||b.miny>=top)continue;if(x<b.minx-r||x>b.maxx+r||z<b.minz-r||z>b.maxz+r)continue;
   const cx=clamp(x,b.minx,b.maxx),cz=clamp(z,b.minz,b.maxz),dx=x-cx,dz=z-cz,d2=dx*dx+dz*dz;if(d2>=r*r)continue;hit=true;
   if(d2>1e-9){const d=Math.sqrt(d2);x=cx+dx/d*r;z=cz+dz/d*r;}
   else{const pl=x-b.minx,pr=b.maxx-x,pb=z-b.minz,pf=b.maxz-z,m=Math.min(pl,pr,pb,pf);if(m===pl)x=b.minx-r;else if(m===pr)x=b.maxx+r;else if(m===pb)z=b.minz-r;else z=b.maxz+r;}}
  for(const c of W.cyls){if(!c.on||c.maxy<=feet+STEP||c.miny>=top)continue;const dx=x-c.x,dz=z-c.z,rr=r+c.r,d2=dx*dx+dz*dz;if(d2>=rr*rr)continue;
   hit=true;const d=Math.sqrt(d2)||1e-4;x=c.x+dx/d*rr;z=c.z+dz/d*rr;}
  return {x,z,hit};}
function groundAt(x,z,reach,m,hh){m=m===undefined?0.12:m;let y=-1e9,ref=null;
  for(const b of W.boxes){if(!b.on||b.maxy>reach)continue;if(x<b.minx-m||x>b.maxx+m||z<b.minz-m||z>b.maxz+m)continue;if(b.maxy>y){y=b.maxy;ref=b;}}
  for(const c of W.cyls){if(!c.on||c.maxy>reach)continue;const dx=x-c.x,dz=z-c.z;if(dx*dx+dz*dz>(c.r+m)*(c.r+m))continue;if(c.maxy>y){y=c.maxy;ref=c;}}
  if(W.ramps)for(const r of W.ramps){const px=x-r.x0,pz=z-r.z0,u=px*r.dx+pz*r.dz;if(u<0||u>r.len)continue;if(Math.abs(px*r.dz-pz*r.dx)>r.w)continue;const ry=lerp(r.y0,r.y1,u/r.len);if(ry<=reach&&ry>y){y=ry;ref=r;}}   // наклонный мостик
  for(const t of W.threads){if(t.len<=0.3||t.ret)continue;if(t.sag&&!(hh&&t.sagOn&&t.sagOn.includes(hh)))continue;if(hh&&t.string&&t.hero===hh)continue;const px=x-t.sx,pz=z-t.sz,u=px*t.dx+pz*t.dz;if(u<-0.4||u>t.len+0.25)continue;
    if(Math.abs(px*t.dz-pz*t.dx)>(t.thick?1.0:t.glued?0.95:0.62))continue;const ty=thY(t,u);if(ty>reach)continue;if(ty>y){y=ty;ref=t;}}
  return {y,ref};}

function ceilingAt(x,z,r,top){let c=1e9;for(const b of W.boxes){if(!b.on||b.miny<top-0.02)continue;if(x<b.minx-r*0.5||x>b.maxx+r*0.5||z<b.minz-r*0.5||z>b.maxz+r*0.5)continue;if(b.miny<c)c=b.miny;}return c;}
function segBox(p,q,b){let t0=0,t1=1;const d=[q.x-p.x,q.y-p.y,q.z-p.z],o=[p.x,p.y,p.z],mn=[b.minx,b.miny,b.minz],mx=[b.maxx,b.maxy,b.maxz];
  for(let i=0;i<3;i++){if(Math.abs(d[i])<1e-9){if(o[i]<mn[i]||o[i]>mx[i])return false;}else{let ta=(mn[i]-o[i])/d[i],tb=(mx[i]-o[i])/d[i];if(ta>tb){const s=ta;ta=tb;tb=s;}t0=Math.max(t0,ta);t1=Math.min(t1,tb);if(t0>t1)return false;}}return true;}
function segCyl(p,q,c){const dx=q.x-p.x,dz=q.z-p.z,l2=dx*dx+dz*dz;let t=l2>0?((c.x-p.x)*dx+(c.z-p.z)*dz)/l2:0;t=clamp(t,0,1);const x=p.x+dx*t-c.x,z=p.z+dz*t-c.z;return x*x+z*z<c.r*c.r&&Math.min(p.y,q.y)<c.maxy&&Math.max(p.y,q.y)>c.miny;}
function occluded(a,b){const p=new V3(a.pos.x,a.pos.y+0.9,a.pos.z),q=new V3(b.pos.x,b.pos.y+0.9,b.pos.z);
  for(const bx of W.boxes)if(bx.on&&bx.occ&&segBox(p,q,bx))return true;for(const c of W.cyls)if(c.on&&c.occ&&segCyl(p,q,c))return true;return false;}
function pathBlocked(a,b){ // закрытые ворота и глухие стены — оставленного через них не переносит
  const p=new V3(a.x,Math.max(a.y,b.y)+0.9,a.z),q=new V3(b.x,Math.max(a.y,b.y)+0.9,b.z);
  for(const g of W.gates)if(g.col.on&&segBox(p,q,g.col))return true;for(const nb of W.noCarry)if(segBox(p,q,nb))return true;
  for(const bx of W.boxes)if(bx.on&&bx.occ&&segBox(p,q,bx))return true;for(const c of W.cyls)if(c.on&&c.occ&&segCyl(p,q,c))return true;return false;}

/* ============================== ФИЗИКА ГЕРОЯ ============================== */
function moveHero(h,dt,wx,wz,speed){const k=h.grounded?12:4.5;h.vel.x=damp(h.vel.x,wx*speed,k,dt);h.vel.z=damp(h.vel.z,wz*speed,k,dt);}
function integrate(h,dt){
  // струна вниз: съезжаем, повиснув на лапах; по ровной — идём, как по канату
  const gr=h.grounded&&h.groundRef&&h.groundRef.string&&!h.groundRef.sag&&h.groundRef.hero!==h?h.groundRef:null;
  if(gr&&Math.abs(gr.y2-gr.y)/Math.max(gr.len,0.1)>0.14){const dn=gr.y2<gr.y?1:-1;h.hang=true;h.vel.x=gr.dx*dn*7;h.vel.z=gr.dz*dn*7;h.face=Math.atan2(gr.dx*dn,gr.dz*dn);}
  else if(h.grounded)h.hang=false;
  h.vel.y-=GRAV*dt;if(h.glide&&h.vel.y<-1.9)h.vel.y=-1.9;if(h.vel.y<-30)h.vel.y=-30;
  const r=h.d.radius,hh=heroHeight(h);
  const res=collideXZ(h.pos.x+h.vel.x*dt,h.pos.z+h.vel.z*dt,r,h.pos.y,h.pos.y+hh);h.pos.x=res.x;h.pos.z=res.z;h.blocked=res.hit;
  if(h.active)for(const e of W.enemies){if(!e.alive||e.state==='hide'||(e.noKill&&e.state==='broken'))continue;const dx=h.pos.x-e.pos.x,dz=h.pos.z-e.pos.z,d=Math.hypot(dx,dz),rr=r+e.r;if(d<rr&&d>1e-4&&Math.abs(h.pos.y-e.pos.y)<1.5){h.pos.x=e.pos.x+dx/d*rr;h.pos.z=e.pos.z+dz/d*rr;}}
  if(h.active)for(const t of W.hittables){if(!t.push||!t.alive())continue;const dx=h.pos.x-t.pos.x,dz=h.pos.z-t.pos.z,d=Math.hypot(dx,dz),rr=r+t.r;if(d<rr&&d>1e-4){h.pos.x=t.pos.x+dx/d*rr;h.pos.z=t.pos.z+dz/d*rr;}}
  if(W.clampR){const c=W.clampR,dx=h.pos.x-c.x,dz=h.pos.z-c.z,d=Math.hypot(dx,dz);if(d>c.r){h.pos.x=c.x+dx/d*c.r;h.pos.z=c.z+dz/d*c.r;}}
  const prevY=h.pos.y;let ny=prevY+h.vel.y*dt;const reach=h.grounded?prevY+STEP:prevY+0.02;const g=groundAt(h.pos.x,h.pos.z,reach,undefined,h);
  if(ny<=g.y&&h.vel.y<=0.001){const landed=!h.grounded;
    // паутинка: две струны крест-накрест — прыжок в перекрестье подбрасывает на три метра
    if(g.ref&&g.ref.string&&landed&&W.webs.some(w=>Math.hypot(w.x-h.pos.x,w.z-h.pos.z)<0.95&&Math.abs(w.y-g.y)<0.7)){ny=g.y+0.02;h.vel.y=14.2;h.grounded=false;h.groundRef=null;h.hang=false;SFX.toss();
      floatText(h.pos.clone().add(new V3(0,h.d.height+0.4,0)),'Паутинка!','#fff2b0');if(W.onWeb)W.onWeb(h);}
    else{if(landed&&-h.vel.y>9&&h.active){shake(h.player,0.03,0.18);SFX.land();}ny=g.y;h.vel.y=0;h.grounded=true;h.groundRef=g.ref;h.lastGroundY=g.y;h.coyote=0.12;}}
  else if(h.grounded&&h.vel.y<=0&&g.y>prevY-0.3&&g.y<=reach){ny=g.y;h.vel.y=0;h.groundRef=g.ref;}
  else{h.grounded=false;h.groundRef=null;}
  h.pos.y=ny;if(h.pos.y<(W.fallY||-9))onFall(h);}
function placeOnGround(h,x,z,yHint){h.pos.set(x,yHint+0.05,z);const g=groundAt(x,z,yHint+1.5,0.3);h.pos.y=g.y>-1e8?g.y:yHint;h.vel.set(0,0,0);h.grounded=true;h.groundRef=g.ref;h.lastGroundY=h.pos.y;}
function onFall(h){ // падение: без урона, назад к колокольчику своего игрока; три падения в одном месте — «Держись за меня»
  const p=players[h.player];
  if(h.active){G.stats.falls++;const now=G.time;p.falls=p.falls.filter(f=>now-f.t<240);const near=p.falls.filter(f=>Math.hypot(f.x-h.pos.x,f.z-h.pos.z)<7).length;p.falls.push({x:h.pos.x,z:h.pos.z,t:now});
    if(near>=2&&!p.clingOffer){p.clingOffer=true;tip(h.player,'Трудное место? Над героем колечко: прыжок '+K(h.player,'jump')+' — и он уцепится за друга до колокольчика',4.5);}
    else tip(h.player,'Упс! Назад к колокольчику — лепестки целы',2.2);}
  const k=p.heroes.indexOf(h);placeOnGround(h,p.cp.x+(k?1.2:-0.4),p.cp.z,p.cp.y);h.iT=1;h.following=false;burst(h.pos.clone().add(new V3(0,0.6,0)),0xffffff,8,3);}
function teleportBehind(o,h){const tx=h.pos.x-Math.sin(h.face)*1.2,tz=h.pos.z-Math.cos(h.face)*1.2;const g=groundAt(tx,tz,h.pos.y+0.5,0);
  if(g.y>h.pos.y-0.5)placeOnGround(o,tx,tz,h.pos.y);else placeOnGround(o,h.pos.x,h.pos.z,h.pos.y);o.stuck=0;burst(o.pos.clone().add(new V3(0,0.5,0)),COL.gold,8,2);}

/* ============================== ДЕЙСТВИЯ ИГРОКОВ ============================== */
function camBack(){return new V3(Math.sin(W.camYaw),0,Math.cos(W.camYaw));}
function updatePlayer(pi,dt){
  const p=players[pi],h=active(pi),o=other(pi);p.spiritLock=Math.max(0,p.spiritLock-dt);p.lockedTip=Math.max(0,p.lockedTip-dt);p.yarnCd=Math.max(0,p.yarnCd-dt);p.owlCd=Math.max(0,p.owlCd-dt);
  if(!h.guard)p.spirit=Math.min(1,p.spirit+dt*0.3);
  if(p.downed){h.guard=false;updateDowned(pi,dt);updateLeftBehind(p,o,dt);return;}
  if(h.cling){updateCling(pi,h);updateLeftBehind(p,o,dt);return;}
  const lock=!!(G.cine||G.trans||G.ui);let ix=0,iz=0;
  if(!lock&&h.knockT<=0){if(btn(pi,'right'))ix+=1;if(btn(pi,'left'))ix-=1;if(btn(pi,'up'))iz+=1;if(btn(pi,'down'))iz-=1;const pa=PADS.axes[pi];if(pa.x||pa.y){ix+=pa.x;iz-=pa.y;}}
  if(W.custom){W.custom(pi,h,dt,{ix,iz,lock});return;}                    // особые уровни (гусельный) управляют героем сами
  const back=camBack(),right=new V3(back.z,0,-back.x);let wx=right.x*ix-back.x*iz,wz=right.z*ix-back.z*iz;const wl=Math.hypot(wx,wz);if(wl>1){wx/=wl;wz/=wl;}
  if(!lock){if(tap(pi,'swap')){const full=p.blue>=1&&W.abil.clew&&!o.cling;doSwap(pi);if(full&&active(pi)!==h)bogatyrExit(pi,active(pi));}
    if(tap(pi,'call'))doCall(pi);if(tap(pi,'item'))throwYarn(pi);}
  const hh=active(pi);if(hh!==h){updateLeftBehind(p,other(pi),dt);return;}
  // держит толстую струну и оборачивается к тем, кто на ней, — струна проседает в ряску (ловушка 1-2)
  if(!lock&&wl>0.3&&!h.hang){const str=W.threads.find(t=>t.string&&t.thick&&t.hero===h&&!t.sag);if(str&&HEROES.some(q=>q!==h&&q.groundRef===str))releaseString(str,true);}
  h.guard=!lock&&btn(pi,'guard')&&p.spiritLock<=0&&h.rollT<=0&&!h.hang;
  // момент нажатия защиты запоминается во времени морока: по нему решается щит / отбив / «Одним махом»
  if(!lock&&tap(pi,'guard')){for(const e of W.enemies)if(e.alive&&e.tgt===h&&e.state==='wind')e.left=e.wdur-e.t;for(const b of W.bolts)if(b.tgt===h&&!b.refl)b.left=b.eta;if(W.onGuardTap)W.onGuardTap(pi,h);}
  if(!lock&&tap(pi,'roll')){if(!W.abil.roll){if(p.lockedTip<=0){p.lockedTip=4;tip(pi,'Кувырок откроется в 1-2 «Кикиморино болото»',2.2);}}
    else if(h.rollCd<=0&&h.grounded&&!h.hang){h.rollT=0.38;h.iT=Math.max(h.iT,0.42);h.rollCd=0.7;h.lastRoll=G.time;if(wl>0.1)h.rollDir.set(wx,0,wz).normalize();else h.rollDir.set(Math.sin(h.face),0,Math.cos(h.face));SFX.roll();}}
  if(!lock&&tap(pi,'attack')&&h.atkCd<=0&&h.rollT<=0&&!h.hang){h.atkT=0.28;h.atkCd=0.36;SFX.swish();heroAttack(h,h.d.range,0.2);if(W.onAttack)W.onAttack(pi,h);}
  if(!lock&&tap(pi,'skill')&&!h.hang)doSkill(pi,h);
  if(!lock&&tap(pi,'jump')&&!h.hang){if(p.clingOffer&&h.grounded)startCling(pi,h);else doJump(h);}
  h.glide=h.kind==='pelageya'&&!lock&&!h.grounded&&btn(pi,'jump')&&h.vel.y<0;
  let sp=h.d.speed;if(h.guard)sp*=0.35;if(h.atkT>0)sp*=0.5;if(W.slowZone&&W.slowZone(h))sp*=0.4;
  if(h.hang){}else if(h.rollT>0){h.vel.x=h.rollDir.x*11;h.vel.z=h.rollDir.z*11;}else if(h.knockT<=0)moveHero(h,dt,wx,wz,sp);
  if(wl>0.1&&h.rollT<=0&&!h.hang)h.face=angDamp(h.face,Math.atan2(wx,wz),h.guard?7:13,dt);
  h.moving=wl>0.1;if(!h.grounded)h.coyote-=dt;
  updateLeftBehind(p,o,dt);}
function doJump(h){if(!(h.grounded||h.coyote>0))return;const top=h.pos.y+heroHeight(h);let v=h.d.jump;
  // стоишь на перекрестье паутинки — прыжок с неё подбрасывает на три метра
  if(h.groundRef&&h.groundRef.string&&W.webs.some(w=>Math.hypot(w.x-h.pos.x,w.z-h.pos.z)<0.95&&Math.abs(w.y-h.pos.y)<0.7)){h.vel.y=14.2;h.grounded=false;h.groundRef=null;h.coyote=0;SFX.toss();floatText(h.pos.clone().add(new V3(0,h.d.height+0.4,0)),'Паутинка!','#fff2b0');if(W.onWeb)W.onWeb(h);return;}
  const c=ceilingAt(h.pos.x,h.pos.z,h.d.radius,top);if(c<1e8){const room=c-top-0.04;if(room<0.08)return;v=Math.min(v,Math.sqrt(2*GRAV*room));}
  h.vel.y=v;h.grounded=false;h.coyote=0;SFX.jump();}
function doSwap(pi){const p=players[pi],h=active(pi),o=other(pi);if(h.cling)return;
  h.firefly=25;h.active=false;h.following=false;h.vel.x=0;h.vel.z=0;h.guard=false;h.glide=false;
  p.act=1-p.act;o.active=true;o.following=false;G.stats.swaps++;SFX.swap();ringFx(o.pos,PCOL[pi],1.6);}
function doCall(pi){const o=other(pi),h=active(pi);if(h.cling)return;
  for(const t of W.threads.slice())if(t.string&&t.hero===o&&!t.sag)releaseString(t,false);   // позвали держащего — он отпускает струну
  o.following=true;o.stuck=0;SFX.call();floatText(h.pos.clone().add(new V3(0,h.d.height+0.7,0)),'Ко мне!',PCSS[pi]);ringFx(h.pos,PCOL[pi],2);}
function updateLeftBehind(p,o,dt){const h=active(p.i);if(W.gaze&&o.firefly>0)o.firefly-=dt;
  if(o.following&&!h.cling){const tx=h.pos.x-Math.sin(h.face)*1.6,tz=h.pos.z-Math.cos(h.face)*1.6,dx=tx-o.pos.x,dz=tz-o.pos.z,d=Math.hypot(dx,dz);
    if(d>0.9){const ux=dx/d,uz=dz/d;o.face=angDamp(o.face,Math.atan2(dx,dz),8,dt);
      // у края: узкую щель перепрыгнет сам, у широкой остановится и подождёт (не падает)
      const gy=groundAt(o.pos.x+ux*0.75,o.pos.z+uz*0.75,o.pos.y+STEP).y,edge=o.grounded&&(gy<o.pos.y-1.2||(W.wetY!==undefined&&gy<W.wetY&&o.pos.y>=W.wetY));   // в ряску сам не лезет
      if(edge){const far=groundAt(o.pos.x+ux*2.3,o.pos.z+uz*2.3,o.pos.y+STEP).y;if(far>o.pos.y-0.6&&far<o.pos.y+0.4&&!(W.wetY!==undefined&&far<W.wetY)){o.vel.x=ux*o.d.speed;o.vel.z=uz*o.d.speed;o.vel.y=o.d.jump;o.grounded=false;}else{o.vel.x=0;o.vel.z=0;}}
      else moveHero(o,dt,ux,uz,Math.min(o.d.speed*1.08,2+d*1.6));
      if(o.blocked&&o.grounded&&d>1.4&&Math.random()<0.1){o.vel.y=o.d.jump;o.grounded=false;}}
    else moveHero(o,dt,0,0,0);
    const real=o.px===undefined?9:Math.hypot(o.pos.x-o.px,o.pos.z-o.pz)/Math.max(dt,1e-3);o.px=o.pos.x;o.pz=o.pos.z;  // реальная скорость: упёрся в стену — «застрял»
    if(d>1.6&&real<0.7)o.stuck+=dt;else o.stuck=Math.max(0,o.stuck-dt);
    if((o.stuck>2.5||d>26)&&!pathBlocked(o.pos,h.pos)){const far=d>4;teleportBehind(o,h);if(far){G.stats.carries++;floatText(o.pos.clone().add(new V3(0,o.d.height+0.6,0)),'Звенышко подтянуло!','#ffd76a');}}
    else if(o.stuck>2.5&&!o.warned){o.warned=true;tip(p.i,'Второму герою путь закрыт — открой проход',2.2);}
    if(o.stuck<0.5)o.warned=false;}
  else{if(!(o.tossT>0))moveHero(o,dt,0,0,0);o.px=undefined;
    // отстал больше чем на 30 м и ничего не держит — подсказчик переносит его к управляемому
    if(!G.cine&&!G.trans&&!o.held&&!h.cling&&h.grounded&&hd(o.pos,h.pos)>30&&!pathBlocked(o.pos,h.pos)){teleportBehind(o,h);G.stats.carries++;floatText(o.pos.clone().add(new V3(0,o.d.height+0.6,0)),'Звенышко подтянуло!','#ffd76a');}}}
/* «Держись за меня»: герой цепляется за героя напарника до следующего колокольчика */
function startCling(pi,h){const c=active(1-pi);players[pi].clingOffer=false;if(c.cling)return;h.cling=true;h.clingBell=players[pi].cpBell;G.stats.clings++;SFX.ok();
  floatText(h.pos.clone().add(new V3(0,h.d.height+0.6,0)),'Держусь!',PCSS[pi]);tip(pi,'Держишься за друга до следующего колокольчика',2.6);tip(1-pi,'Друг держится за тебя — донеси до колокольчика!',2.6);}
function updateCling(pi,h){const c=active(1-pi);h.pos.set(c.pos.x-Math.sin(c.face)*0.3,c.pos.y+heroHeight(c)*0.72,c.pos.z-Math.cos(c.face)*0.3);h.vel.set(0,0,0);h.face=c.face;h.grounded=true;h.groundRef=null;
  for(const b of W.bells){if(b===h.clingBell)continue;if(hd(c.pos,b)<2.6){h.cling=false;placeOnGround(h,c.pos.x+1.0,c.pos.z+0.7,c.pos.y);floatText(h.pos.clone().add(new V3(0,h.d.height+0.5,0)),'Спасибо!',PCSS[pi]);
    const o=other(pi);if(hd(o.pos,h.pos)>12){teleportBehind(o,h);o.following=false;}   // «Держись за меня» — пропуск трудного места: второй герой пары тоже здесь
    break;}}}
function doSkill(pi,h){const p=players[pi];
  if(W.rzt&&W.rzt.state==='count'){rztPress(pi);return;}
  if(h.kind==='proshka'){if(h.skillCd>0)return;h.skillCd=0.5;shootAcorn(h,findMark(h));return;}
  if(h.kind==='yosha'){if(h.skillCd>0)return;h.skillCd=0.8;ladle(h);return;}
  if(h.kind==='potap'&&W.abil.toss){if(h.skillCd>0)return;h.skillCd=0.8;toss(h);return;}
  if(h.kind==='pelageya'&&W.abil.owl){if(p.owlCd>0){floatText(h.pos.clone().add(new V3(0,h.d.height+0.5,0)),'Глаза отдыхают…','#e7c3ff');return;}p.owlCd=6;owlSight(h);return;}
  if(p.lockedTip<=0){p.lockedTip=5;SFX.miss();floatText(h.pos.clone().add(new V3(0,h.d.height+0.5,0)),'Ещё не умею!',PCSS[pi]);
    tip(pi,h.kind==='potap'?'Подкидка Потапа откроется в 1-1 «Избушка, повернись»':'Совиный взор Пелагеи откроется в 1-4 «Леший водит»',3);}}
/* RT Потапа — подкидка: подбрасывает стоящего рядом героя */
function toss(h){let best=null,bd=2.4;for(const o of HEROES){if(o===h||o.cling)continue;if(o.active&&players[o.player].downed)continue;const d=hd(o.pos,h.pos);if(d<bd&&Math.abs(o.pos.y-h.pos.y)<0.8){bd=d;best=o;}}
  SFX.toss();h.atkT=0.28;
  if(!best){floatText(h.pos.clone().add(new V3(0,h.d.height+0.5,0)),'Подкидка — встань рядом с другом','#e0b27a');return;}
  best.vel.y=13.6;best.vel.x=Math.sin(h.face)*2.2;best.vel.z=Math.cos(h.face)*2.2;best.grounded=false;best.following=false;best.tossT=1.2;ringFx(best.pos,0xc08a48,1.6);floatText(best.pos.clone().add(new V3(0,best.d.height+0.5,0)),'Оп!','#ffd9a0');
  if(!G.flags.tossBark){G.flags.tossBark=true;later(0.5,()=>bark(h,'potap','Как Илья Муромец… э-э… подкидывал.',2.6));}}
/* RT Пелагеи — Совиный взор: 4 секунды видно скрытое (настоящую тропу, тайники, настоящего двойника) */
function owlSight(h){W.owlT=4;SFX.owl();floatText(h.pos.clone().add(new V3(0,h.d.height+0.5,0)),'Совиный взор!','#e7c3ff');if(W.onOwl)W.onOwl(h);}
function findMark(h){let best=null,bd=1e9;const fx=Math.sin(h.face),fz=Math.cos(h.face);
  for(const m of W.marks){if(!m.active())continue;const dx=m.pos.x-h.pos.x,dz=m.pos.z-h.pos.z,d=Math.hypot(dx,dz);if(d>14)continue;if(d>4&&(dx*fx+dz*fz)/d<-0.3)continue;if(d<bd){bd=d;best=m;}}return best;}

function O(text,done,targets,ghost,hint){return {text,done,targets:targets||(()=>[]),ghost:ghost||null,hint:hint||null};}
const ghosts=[{g:null,kind:null,spec:null,t:0},{g:null,kind:null,spec:null,t:0}];
function setPulse(pi,list){const p=players[pi];for(const m of p.pulsed)restoreEm(m);p.pulsed=list||[];}
function restoreEm(m){const mat=m.material;if(mat&&mat.userData&&mat.userData.baseEm){mat.emissive.copy(mat.userData.baseEm);mat.emissiveIntensity=mat.userData.baseEi;delete mat.userData.baseEm;}}
function pulseEm(m){const mat=m.material;if(!mat||!mat.emissive||mat.userData.shared)return;if(!mat.userData.baseEm){mat.userData.baseEm=mat.emissive.clone();mat.userData.baseEi=mat.emissiveIntensity;}
  const k=0.5+0.5*Math.sin(G.time*6);mat.emissive.setRGB(1,0.9,0.45);mat.emissiveIntensity=0.15+0.75*k;}
function hideGhost(pi){const gh=ghosts[pi];if(gh.g)gh.g.visible=false;gh.spec=null;}
function showGhost(pi,spec){if(!spec)return;const gh=ghosts[pi];if(gh.spec)return;
  if(gh.kind!==spec.kind){if(gh.g)scene.remove(gh.g);gh.g=buildHeroMesh(spec.kind,true).g;scene.add(gh.g);gh.kind=spec.kind;}
  gh.spec=spec;gh.t=0;gh.g.visible=true;}
function updateGhosts(dt){for(const gh of ghosts){if(!gh.spec||!gh.g)continue;gh.t+=dt;const s=gh.spec,u=(gh.t%2.8)/2.2,k=smooth(u);
  const from=s.from,to=s.to||s.from,g=gh.g;g.rotation.y=Math.atan2(to.x-from.x,to.z-from.z)||Math.PI;
  if(s.action==='walk'){g.position.lerpVectors(from,to,k);g.position.y=from.y+Math.abs(Math.sin(gh.t*9))*0.08;}
  else if(s.action==='jump'){g.position.lerpVectors(from,to,k);g.position.y=lerp(from.y,to.y,k)+4*k*(1-k)*2.2;}
  else if(s.action==='glide'){g.position.lerpVectors(from,to,k);g.position.y=lerp(from.y,to.y,k)+1.4*Math.sin(Math.min(1,k*1.6)*Math.PI*0.5)*(1-k*0.8);}
  else{g.position.copy(from);g.position.y=from.y+Math.abs(Math.sin(gh.t*5))*0.35;g.rotation.y=Math.PI+Math.sin(gh.t*3)*0.4;}}}
function updateObjectives(dt){for(const pi of[0,1]){const p=players[pi],list=W.objectives[pi];let o=list[p.obj];
  let guard=0;while(o&&o.done()&&guard++<12){p.obj++;p.idle=0;setPulse(pi,[]);hideGhost(pi);o=list[p.obj];tone(880,0.08,'sine',0.15);}
  if(!o)continue;if(!G.cine&&!G.trans)p.idle+=dt;
  if(p.idle>20){if(!p.pulsed.length){const ms=[];for(const t of o.targets())meshesOf(t).forEach(m=>ms.push(m));setPulse(pi,ms);}p.pulsed.forEach(pulseEm);}

function play(def){const S={t:0,dur:def.dur,cam:true,camPos:new V3(),camLook:new V3(),snap:true,camK:def.camK||4.5,fov:def.fov||50,skippable:def.skip!==false,ei:0,si:-1,yi:0};
  const ev=(def.events||[]).slice().sort((a,b)=>a.t-b.t),shots=def.shots||[],says=def.says||[];
  const P=v=>new V3(v[0],v[1],v[2]);
  const setCam=t=>{let i=-1;for(let k=0;k<shots.length;k++)if(shots[k].t<=t)i=k;if(i<0)return;const s=shots[i];if(i!==S.si){S.si=i;if(s.cut!==false)S.snap=true;}
    S.camPos.copy(P(s.p));S.camLook.copy(P(s.l));if(s.p2){const k=smooth((t-s.t)/(s.dur||2));S.camPos.lerp(P(s.p2),k);S.camLook.lerp(P(s.l2||s.l),k);}};
  S.update=(t,dt)=>{while(S.ei<ev.length&&ev[S.ei].t<=t){ev[S.ei].fn();S.ei++;}
    while(S.yi<says.length&&says[S.yi][0]<=t){const y=says[S.yi];say(y[2],y[3],y[1],y[4]);S.yi++;}
    setCam(t);if(def.tick)def.tick(t,dt||0);};
  S.skip=()=>{G.stats.skips++;while(S.ei<ev.length){ev[S.ei].fn();S.ei++;}S.yi=says.length;subT=0;if(def.tick)def.tick(def.dur,0);};
  S.end=()=>{subT=0;if(def.end)def.end();};
  G.cine=S;S.update(0,0);}
const shot=(t,p,l,p2,l2,dur,cut)=>({t,p,l,p2,l2,dur,cut});

function updateTrans(dt){const T=G.trans;if(!T)return;T.t+=dt;$('fade').style.opacity=T.t<0.8?T.t/0.8:Math.max(0,1-(T.t-0.8)/0.8);

      (t?'<br>Сказ «Леший-проводник»: <i>'+t[0]+'. И помог им '+t[1].replace(/^./,c=>c.toLowerCase())+'. '+t[2]+'.</i>':'')+

      '<br>Смен героя: '+s.swaps+' · Падений (без урона): '+s.falls+' · Подшили друга: '+s.revives+' · Звенышко подтянуло оставленных: '+s.carries+

  if(mode==='end'){const s=G.stats,m=Math.floor(G.playTime/60),sec=Math.floor(G.playTime%60);
    return top+'<h2 style="color:#ffc93c">Пролог пройден! Звенья: '+Math.max(1,G.links)+' (Звенышко)</h2><div class="res">Время: '+m+' мин '+sec+' с'+(s.skips?' · пропущено роликов: '+s.skips:'')+

function cyclePath(pi){const p=players[pi];p.path=PATHS[(PATHS.indexOf(p.path)+1)%3];}

  for(const pi of[0,1]){const b=$('e'+pi);if(b)b.onclick=()=>{cyclePath(pi);showMenu(mode);};}const sb=$('subsb');if(sb)sb.onclick=()=>{G.subs=!G.subs;showMenu(mode);};
  const lp=$('lvp'),ln=$('lvn');if(lp)lp.onclick=()=>{pickLevel(-1);};if(ln)ln.onclick=()=>{pickLevel(1);};}

// начать с любого уровня: всё, что раньше, считается пройденным со всеми звеньями
function startFrom(i){for(const k in G.stats)G.stats[k]=0;G.playTime=0;G.links=0;G.flags={};G.done={};G.got={};G.nutsGot={};
  players.forEach(p=>{p.enc={};p.shieldTaught=false;p.closedTaught=false;p.staggerSeen=0;p.blue=0;p.act=0;});

  LEVELS.forEach((l,k)=>{if(l.world&&!l.boss&&k<i){G.done[l.id]=true;G.got[l.id]=l.links;G.nutsGot[l.id]=l.nuts;}});
  if(L.boss)G.flags.forged=true;loadLevel(i);hideMenu();}
function showTitle(){const lv=$('level');lv.innerHTML=W.name+'<br><span style="font-size:18px;font-weight:600;opacity:.85">'+W.sub+'</span>';lv.style.opacity=1;clearTimeout(showTitle.t);showTitle.t=setTimeout(()=>{lv.style.opacity=0;},3600);}

function menuInput(){if(G.state==='end'){if(pressed.has('Enter')){if(G.flags.voiceDone){$('menu').classList.add('hide');G.state='play';}else restart();}return;}
  if(G.state==='menu'){const a=uiNav(0),b=uiNav(1),d=a.dx||b.dx;if(d||pressed.has('ArrowLeft')&&!d||pressed.has('ArrowRight')&&!d){pickLevel(d||(pressed.has('ArrowLeft')?-1:1));return;}
    if(pressed.has('Enter')){const i=G.startIdx||0;if(i===0&&W.levelId==='p'&&!G.playTime)hideMenu();else startFrom(i);return;}}
  if(pressed.has('Tab')||pressed.has('PadBack')){PADS.swap=!PADS.swap;showMenu(G.state);}if(pressed.has('KeyQ')){cyclePath(0);showMenu(G.state);}if(pressed.has('KeyK')){cyclePath(1);showMenu(G.state);}

let last=performance.now();

  if(G.state==='play'&&G.manual){}else if(G.state==='play'){if(pressed.has('Escape')){showMenu('pause');}else{if(G.hitstop>0){G.hitstop-=dt;dt*=0.15;}step(dt);}}else menuInput();
  render();updateUI(Math.min(0.05,G.state==='play'?dt:0));pressed.clear();}
hudInit();loadLevel(0);showMenu('menu');requestAnimationFrame(frame);
window.ZC={G,players,loadLevel,HERO,get W(){return W;},step,completeLevel,finishLevel,goLevel,startFrom,LEVELS,LV,worldLinks,
  sim(sec){const n=Math.round(sec*60);for(let i=0;i<n;i++){if(G.state!=='play')break;step(1/60);if(i%30===0)updateUI(1/60);pressed.clear();}render();updateUI(1/60);},
  start(){hideMenu();},menu:showMenu,tick(n){for(let i=0;i<(n||1);i++){step(1/60);pressed.clear();}},press(c){pressed.add(c);},hold(c,on){if(on)down.add(c);else down.delete(c);},skip(){if(G.cine){G.cine.skip();G.cine.t=G.cine.dur;}}};
