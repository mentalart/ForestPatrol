<style>
:root{
  --bg:#fbf5e6;--surface:#fffdf6;--surface2:#f5ecd6;--ink:#2b2118;--muted:#6b5e4f;--line:#e7d8b8;
  --gold:#e0a31a;--gold2:#ffd65a;--gold-ink:#3b2a00;--red:#c8412b;--linen:#f3e6c8;
  --accent:#3f9b3a;--accent-strong:#2f7d2b;--accent2:#f2b705;--on-accent:#fff;
  --sky1:#8fd3ff;--sky2:#e9f8ff;--hill1:#7cc35a;--hill2:#5aa84a;--hill3:#3f8f3d;--sea:#45b3d9;--sun:#ffd34d;
  --oak1:#3f8f3d;--oak2:#2f7a34;--trunk:#7a4f2c;--stars:0;
  --f1:#8ea6c6;--f2:#b7a2d8;--f3:#f3c843;--f4:#9dd35b;--f5:#44b85a;
  --shadow:0 5px 0 rgba(90,60,10,.10),0 14px 30px rgba(90,60,10,.12);
  --fs:18px;--radius:22px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121826;--surface:#1b2335;--surface2:#242e44;--ink:#f4ecdc;--muted:#b5aa95;--line:#34415e;
  --gold:#f0b52a;--gold2:#ffd96b;--linen:#2a2f3f;--red:#e0664f;
  --sky1:#0c1431;--sky2:#2b3a66;--hill1:#2d5a3c;--hill2:#244a33;--hill3:#1b3a2a;--sea:#1f4f78;--sun:#f5edc8;
  --oak1:#24503a;--oak2:#1b3f2e;--trunk:#4d3421;--stars:1;
  --shadow:0 5px 0 rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.35);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121826;--surface:#1b2335;--surface2:#242e44;--ink:#f4ecdc;--muted:#b5aa95;--line:#34415e;
  --gold:#f0b52a;--gold2:#ffd96b;--linen:#2a2f3f;--red:#e0664f;
  --sky1:#0c1431;--sky2:#2b3a66;--hill1:#2d5a3c;--hill2:#244a33;--hill3:#1b3a2a;--sea:#1f4f78;--sun:#f5edc8;
  --oak1:#24503a;--oak2:#1b3f2e;--trunk:#4d3421;--stars:1;
  --shadow:0 5px 0 rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.35);color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 var(--fs)/1.5 Nunito,"Trebuchet MS",system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit}
img{max-width:100%}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ——— сцена-шапка ——— */
.scene{position:relative;height:clamp(230px,36vw,350px);overflow:hidden;background:var(--sky1)}
.scene svg.sky{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .hero,.scene .kot,.scene .zv{cursor:pointer}
.scene .hero image{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.8s ease-in-out infinite;animation-delay:var(--d)}
.scene .hero:hover image,.scene .hero:focus image{filter:drop-shadow(0 0 6px var(--gold2))}
.scene .hero.jump image{animation:jump .75s cubic-bezier(.3,1.5,.5,1)}
.scene .hero:focus,.scene .kot:focus{outline:none}
.scene .cloud{animation:drift linear infinite}
.scene .c1{animation-duration:70s}.scene .c2{animation-duration:95s;animation-delay:-40s}.scene .c3{animation-duration:120s;animation-delay:-80s}
.scene .rays{transform-box:fill-box;transform-origin:50% 50%;animation:spin 40s linear infinite}
.scene .star{opacity:var(--stars);animation:tw 3s ease-in-out infinite}
.scene .wave{animation:wave 5s ease-in-out infinite alternate}
.scene .chainlink{animation:shine 3s ease-in-out infinite;animation-delay:var(--d)}
.zv .wing{transform-box:fill-box;transform-origin:50% 100%;animation:flap .35s ease-in-out infinite alternate}
.zv .eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.5s infinite}
.tools{position:absolute;top:10px;right:12px;display:flex;gap:8px;z-index:3}
.tbtn{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.78);color:#2b2118;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.tbtn svg{width:22px;height:22px}
.tbtn[aria-pressed="false"]{opacity:.6}
.bubble{position:absolute;z-index:4;max-width:min(260px,70vw);background:#fffdf6;color:#2b2118;border:3px solid #2b2118;border-radius:18px;padding:8px 12px;font:800 .82em/1.3 Nunito,sans-serif;
  transform:translate(-50%,-100%);pointer-events:none;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;background:#fffdf6;border-right:3px solid #2b2118;border-bottom:3px solid #2b2118;transform:translateX(-50%) rotate(45deg)}

/* ——— титул ——— */
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.titlecard{position:relative;margin:-28px auto 0;background:var(--surface);border:3px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);text-align:center;padding:0 16px 16px;overflow:hidden;z-index:2}
.rushnik{height:14px;margin:0 -16px 12px;background:
  linear-gradient(45deg,transparent 36%,var(--red) 36% 64%,transparent 64%) 0 0/14px 14px,
  linear-gradient(-45deg,transparent 36%,var(--red) 36% 64%,transparent 64%) 0 0/14px 14px,var(--linen)}
.logo{margin:4px 0 0;font:400 clamp(34px,7.5vw,58px)/1.05 "Ruslan Display",Podkova,serif;letter-spacing:.02em;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#b8740c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(80,45,0,.45))}
.sub{margin:4px 0 8px;font:700 1em/1.3 Podkova,serif;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-strong);color:var(--on-accent);border-radius:999px;padding:4px 14px;font:800 .9em Nunito,sans-serif}

/* ——— цепь-прогресс ——— */
.chainbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid var(--line);margin-top:14px}
.chainbar .wrap{display:flex;flex-direction:column;align-items:center;padding-top:8px;padding-bottom:6px}
.links{display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;max-width:100%}
.link{border:0;background:none;padding:0;margin:0 -5px;cursor:pointer;width:clamp(32px,8vw,48px);height:32px;display:grid;place-items:center;position:relative}
.link svg{width:100%;height:100%;overflow:visible}
.link:not(.fin):nth-child(even) svg{transform:scale(.62,1)}
.link .ring{fill:none;stroke:var(--line);stroke-width:5}
.link .fill{fill:none;stroke:url(#goldg);stroke-width:5;opacity:var(--p,0);transition:opacity .4s}
.link.cur svg{animation:pulse 1.4s ease-in-out infinite}
.link.cur .ring{stroke:var(--accent)}
.link.done .fill{filter:drop-shadow(0 0 3px var(--gold2))}
.link.fin{margin-left:4px}
.link.fin .st{fill:var(--line);transition:fill .3s}.link.fin.on .st{fill:var(--gold)}
.chainlabel{font:700 .8em/1.3 Nunito,sans-serif;color:var(--muted);margin-top:2px;text-align:center;min-height:1.3em}

/* ——— экраны ——— */
main{padding:18px 0 40px}
.enter{animation:rise .45s cubic-bezier(.2,.9,.3,1) both}
.card{background:var(--surface);border:3px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.intro{text-align:center}
.intro .zvbig{width:120px;height:120px;margin:-6px auto 0;display:block}
.intro h2,.final h2{font:800 1.6em/1.2 Podkova,serif;margin:6px 0 10px}
.lead{font-size:1.05em;margin:0 auto 14px;max-width:36em}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 12px}
.meta span{background:var(--surface2);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.88em}
.note{background:color-mix(in srgb,var(--accent2) 16%,var(--surface));border:2px dashed color-mix(in srgb,var(--accent2) 60%,var(--line));border-radius:16px;padding:10px 14px;font-size:.9em;text-align:left;margin:0 0 14px}
.draftnote{font-size:.85em;color:var(--muted);margin-top:8px}

.banner{position:relative;height:clamp(170px,30vw,240px);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:var(--surface2)}
.banner .bg{position:absolute;inset:-7%;background-size:cover;background-position:center;animation:kb 24s ease-in-out infinite alternate}
.banner .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.62))}
.banner .cap{position:absolute;left:18px;bottom:14px;right:40%;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.banner .chap{display:inline-block;font:800 .72em/1 Nunito,sans-serif;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.35);border-radius:999px;padding:5px 10px}
.banner h2{margin:6px 0 0;font:800 clamp(1.35em,4.6vw,1.9em)/1.1 Podkova,serif}
.banner .stk{position:absolute;right:8px;bottom:-6px;height:84%;display:flex;align-items:flex-end;gap:0}
.banner .stk img{height:100%;max-width:34vw;object-fit:contain;margin-left:-14px;filter:drop-shadow(0 6px 5px rgba(0,0,0,.35));animation:popin .6s cubic-bezier(.3,1.6,.5,1) both,bob 3.2s ease-in-out infinite;animation-delay:var(--d),calc(var(--d) + .6s);transform-origin:50% 100%}
.banner .stk img:nth-child(2){height:82%}.banner .stk img:nth-child(3){height:74%}
.say{display:flex;align-items:flex-end;gap:10px;margin:-18px 8px 8px;position:relative;z-index:2}
.say .ava{width:72px;height:72px;flex:none;object-fit:contain;background:var(--surface);border:3px solid var(--line);border-radius:50%;padding:4px;box-shadow:var(--shadow)}
.say .bub{position:relative;background:var(--surface);border:3px solid var(--line);border-radius:20px 20px 20px 6px;padding:10px 14px;box-shadow:var(--shadow);font-weight:700;flex:1;display:flex;gap:8px;align-items:flex-start}
.say .bub p{margin:0;flex:1}

.pick{position:relative;border:3px solid var(--line);border-radius:18px;background:radial-gradient(circle at 50% 62%,var(--surface2),var(--surface) 72%);padding:8px 6px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}

textarea,.tin{width:100%;border:2px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--ink);font:600 1em/1.45 Nunito,sans-serif;padding:10px 12px;resize:vertical}
textarea{min-height:92px}

.btn{border:0;border-radius:16px;padding:13px 22px;font:800 1.02em/1.2 Nunito,sans-serif;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .1s,box-shadow .1s}

function faceSVG(l,n){const t=n===3?[0,.5,1][l-1]:(l-1)/4,ci=Math.round(t*4),c=(t-.5)*2;const my=44,cy=my+13*c;

  const brows=t===0?'<path d="M17 20 l9 3 M47 20 l-9 3" stroke="#2b2118" stroke-width="2.6" stroke-linecap="round"/>':'';
  const cheeks=t>=.75?'<circle cx="16" cy="38" r="4" fill="#ff8f80" opacity=".55"/><circle cx="48" cy="38" r="4" fill="#ff8f80" opacity=".55"/>':'';
  const mouth=t===1?`<path d="M20 40 Q32 56 44 40 Z" fill="#7a2a1a" stroke="#2b2118" stroke-width="2.4" stroke-linejoin="round"/><path d="M26 47 Q32 51 38 47" fill="#ff8f80"/>`:t===.5?'<path d="M22 44 H42" stroke="#2b2118" stroke-width="3" stroke-linecap="round"/>':`<path d="M20 ${my} Q32 ${cy} 44 ${my}" fill="none" stroke="#2b2118" stroke-width="3" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><polygon points="32,3 55,12 61,34 52,55 32,61 12,55 3,34 9,12" fill="${FACECOL[ci]}" stroke="rgba(0,0,0,.2)" stroke-width="2" stroke-linejoin="round"/><polygon points="32,3 55,12 32,30" fill="#fff" opacity=".18"/><polygon points="3,34 12,55 32,30" fill="#000" opacity=".07"/><polygon points="61,34 52,55 32,30" fill="#000" opacity=".1"/>${brows}${eyes}${cheeks}${mouth}</svg>`;}

// ——— видимость и ответы ———
const has=v=>!(v==null||v===''||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length));
function visible(q){const c=q.showIf;if(!c)return true;if(!visible(QMAP[c.q]))return false;const v=S.A[c.q];if(!has(v))return false;const arr=Array.isArray(v)?v:[v];
  if(c.in)return arr.some(x=>c.in.includes(x));if(c.not)return arr.some(x=>!c.not.includes(x));if(c.lte!=null)return +v<=c.lte;if(c.gte!=null)return +v>=c.gte;return true;}
const answered=q=>has(S.A[q.id]);
function secStat(si){let a=0,n=0;for(const q of SECS[si].q){if(!visible(q))continue;n++;if(answered(q))a++;}return {a,n};}
function answeredTotal(){let a=0;for(const q in QMAP)if(visible(QMAP[q])&&answered(QMAP[q]))a++;return a;}
function visibleTotal(){let n=0;for(const q in QMAP)if(visible(QMAP[q]))n++;return n;}
let saveT=0;function save(now){clearTimeout(saveT);const f=()=>ls.set(KEY,S);if(now)f();else saveT=setTimeout(f,250);}

// ——— отрисовка вопросов ———
const optsOf=q=>(q.o||[]).map(o=>typeof o==='string'?{v:o}:o);
function body(q){const v=S.A[q.id],n=q.n||(q.t==='faces'?SV.faces:5);
  switch(q.t){
  case 'faces':return `<div class="faces${has(v)?' has':''}" role="radiogroup">${Array.from({length:n},(_,i)=>i+1).map(l=>`<button class="face opt${v===l?' sel':''}" data-v="${l}" role="radio" aria-checked="${v===l}">${faceSVG(l,n)}<span>${FACELAB[n][l-1]}</span></button>`).join('')}</div>`;
  case 'stars':{const lab=['Плохо','Так себе','Нормально','Хорошо','Отлично!'];return `<div class="stars" role="radiogroup">${[1,2,3,4,5].map(l=>`<button class="starb opt${v>=l?' on':''}" style="--d:${(l-1)*60}ms" data-v="${l}" role="radio" aria-checked="${v===l}" aria-label="${l}">${ICON.star}</button>`).join('')}<span class="starlab">${has(v)?lab[v-1]:''}</span></div>`;}
  case 'scale':return `<div class="scale" style="--n:${n}" role="radiogroup">${Array.from({length:n},(_,i)=>i+1).map(l=>`<button class="pill opt${v===l?' sel':''}" data-v="${l}" role="radio" aria-checked="${v===l}">${l}</button>`).join('')}</div><div class="ends"><span>${esc(q.lo||'')}</span>${q.mid?`<span>${esc(q.mid)}</span>`:''}<span>${esc(q.hi||'')}</span></div>`;
  case 'nps':return `<div class="scale nps" role="radiogroup">${Array.from({length:11},(_,i)=>i).map(l=>`<button class="pill opt${v===l?' sel':''}" style="--c:${l<=6?'#d0573f':l<=8?'#d9a520':'#3f9b3a'}" data-v="${l}" role="radio" aria-checked="${v===l}">${l}</button>`).join('')}</div><div class="ends"><span>0 — ${esc(q.lo||'')}</span><span>10 — ${esc(q.hi||'')}</span></div>`;
  case 'yesno':{const o=q.o||['Да','Нет','Не знаю'];return `<div class="yn" role="radiogroup">${o.map((x,i)=>`<button class="pill opt${v===x?' sel':''}" data-v="${i}" role="radio" aria-checked="${v===x}">${['👍 ','👎 ','🤔 '][i]||''}${esc(x)}</button>`).join('')}</div>`;}
  case 'chips':{const o=optsOf(q),sel=q.multi?(v||[]):[v];let s=`<div class="chips">${o.map((x,i)=>`<button class="chip opt${sel.includes(x.v)?' sel':''}" data-v="${i}" aria-pressed="${sel.includes(x.v)}">${esc(x.v)}</button>`).join('')}${q.other?`<button class="chip opt${sel.includes('Своё')?' sel':''}" data-v="other">Своё…</button>`:''}</div>`;
    if(q.multi)s+=`<div class="counter">${q.max?`Выбрано ${sel.length} из ${q.max}`:(sel.length?`Выбрано: ${sel.length}`:'Можно выбрать несколько')}</div>`;
    if(q.other&&sel.includes('Своё'))s+=`<input class="tin other" data-other="${q.id}" value="${esc(S.A[q.id+'_other']||'')}" placeholder="Напиши своё">`;return s;}
  case 'pick':{const o=optsOf(q),sel=q.multi?(v||[]):[v],bg=q.kind==='bg';
    return `<div class="picks${bg?' bgk':''}${has(v)?' has':''}">${o.map((x,i)=>`<button class="pick opt${bg?' bg':''}${sel.includes(x.v)?' sel':''}" data-v="${i}" aria-pressed="${sel.includes(x.v)}"><img src="${A_(x.img)}" alt="" loading="lazy"><span class="l">${esc(x.v)}</span>${x.s?`<span class="s">${esc(x.s)}</span>`:''}</button>`).join('')}${q.none?`<button class="pick opt none${sel.includes(q.none)?' sel':''}" data-v="none"><span class="big">✨</span><span class="l">${esc(q.none)}</span></button>`:''}</div>${q.multi&&q.max?`<div class="counter">Выбрано ${sel.length} из ${q.max}</div>`:''}`;}
  case 'text':return q.short?`<input class="tin" data-text="${q.id}" value="${esc(v||'')}" placeholder="${esc(q.ph||'')}">`:`<textarea data-text="${q.id}" placeholder="${esc(q.ph||(YOU?'Ваш ответ':'Напиши здесь…'))}">${esc(v||'')}</textarea>`;
  case 'matrix':return matrix(q);
  case 'draw':return `<div class="draw"><canvas width="800" height="500" data-draw="${q.id}"></canvas></div><div class="dtools" data-dtools="${q.id}"></div>`;
  }return '';}
function matrix(q){const v=S.A[q.id]||{},sc=q.scale||'faces',n=sc==='faces'?SV.faces:5;
  const leg=sc==='faces'?'':`<div class="mx-legend"><span>1 — ${esc(q.lo||'')}</span><span>5 — ${esc(q.hi||'')}</span></div>`;

  return leg+q.rows.map((r,ri)=>{const cur=v[r.v];const img=r.img?(r.img.startsWith('bg_')?`<img class="bgi" src="${A_(r.img)}" alt="">`:`<img src="${A_(r.img)}" alt="">`):(r.emoji?`<span class="em">${r.emoji}</span>`:'');
    const btns=Array.from({length:n},(_,i)=>i+1).map(l=>sc==='faces'?`<button class="face opt${cur===l?' sel':''}" data-row="${ri}" data-v="${l}" aria-label="${FACELAB[n][l-1]}" title="${FACELAB[n][l-1]}">${faceSVG(l,n)}</button>`:`<button class="pill opt${cur===l?' sel':''}" ${sc==='d5'?`style="--c:${D5[l-1]}"`:''} data-row="${ri}" data-v="${l}">${l}</button>`).join('');
    return `<div class="mx-row${has(cur)?' ok':''}${sc==='d5'?' d5':''}"><div class="rl">${img}<span>${esc(r.v)}</span></div><div class="mx-opts${has(cur)&&sc==='faces'?' has':''}">${btns}${q.na?`<button class="pill opt na${cur==='na'?' sel':''}" data-row="${ri}" data-v="na">${esc(q.na)}</button>`:''}</div></div>`;}).join('');}
function qHTML(q,num,i){const sub=!!q.showIf;const spk=TTS?`<button class="spk" data-say="q:${q.id}" aria-label="Прочитать вслух">${ICON.spk}</button>`:'';
  return `<article class="q${sub?' sub':''}${answered(q)?' ok':''}${visible(q)?'':' hidden'}" id="q-${q.id}" data-qid="${q.id}" style="--i:${i}"><header><span class="num${sub?' arrow':''}">${sub?'↳':num}</span><h3>${esc(q.q)}</h3>${spk}</header>${q.h?`<p class="hint">${esc(q.h)}</p>`:''}<div class="qb">${body(q)}</div></article>`;}

  else if(q.t==='yesno')t+='. Да, нет или не знаю.';else if(q.t==='faces')t+='. Выбери рожицу.';else if(q.t==='stars')t+='. Выбери от одной до пяти звёзд.';return t;}

function refreshCard(q){const el=document.getElementById('q-'+q.id);if(!el)return;el.querySelector('.qb').innerHTML=body(q);el.classList.toggle('ok',answered(q));
  if(q.t==='draw')initDraws(el);}
function refreshDeps(id){for(const q of SECS[QMAP[id].si].q){if(!q.showIf)continue;const el=document.getElementById('q-'+q.id);if(!el)continue;const vis=visible(q),was=!el.classList.contains('hidden');
  if(vis!==was){el.classList.toggle('hidden',!vis);if(vis){el.classList.remove('reveal');void el.offsetWidth;el.classList.add('reveal');}}}}
function afterChange(q,e,b){save();refreshCard(q);refreshDeps(q.id);updChain();const r=b.getBoundingClientRect();sparkle(e&&e.clientX?e.clientX:r.left+r.width/2,e&&e.clientY?e.clientY:r.top+r.height/2);chime();
  if(S.sent)S.sentSig=null;}
function choose(q,b,e){const A=S.A,raw=b.dataset.v;
  if(q.t==='matrix'){const row=q.rows[+b.dataset.row].v,m=Object.assign({},A[q.id]||{}),val=raw==='na'?'na':+raw;if(m[row]===val)delete m[row];else m[row]=val;A[q.id]=m;return afterChange(q,e,b);}
  if(['faces','stars','scale','nps'].includes(q.t)){const val=+raw;A[q.id]=A[q.id]===val?null:val;return afterChange(q,e,b);}
  if(q.t==='yesno'){const o=q.o||['Да','Нет','Не знаю'],val=o[+raw];A[q.id]=A[q.id]===val?null:val;return afterChange(q,e,b);}
  if(q.t==='chips'||q.t==='pick'){const o=optsOf(q);const val=raw==='none'?q.none:raw==='other'?'Своё':o[+raw].v;
    if(!q.multi){A[q.id]=A[q.id]===val?null:val;return afterChange(q,e,b);}
    let arr=(A[q.id]||[]).slice();if(arr.includes(val))arr=arr.filter(x=>x!==val);else{if(val===q.none)arr=[val];else{arr=arr.filter(x=>x!==q.none);
      if(q.max&&arr.length>=q.max){const c=document.querySelector('#q-'+q.id+' .counter');if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}bell(220,.3,.06);return;}arr.push(val);}}
    A[q.id]=arr;return afterChange(q,e,b);}}

// ——— рисунок ———
const PAL=['#2b2118','#c8412b','#f28c28','#f2c705','#3f9b3a','#1d7fb8','#7b5cd6','#ff8fb3','#8a5a2b','#ffffff'];
function initDraws(root){root.querySelectorAll('canvas[data-draw]').forEach(cv=>{if(cv._init)return;cv._init=1;const id=cv.dataset.draw,ctx=cv.getContext('2d');
  const paint=()=>{ctx.fillStyle='#fffdf6';ctx.fillRect(0,0,cv.width,cv.height);};paint();
  if(S.A[id]){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,cv.width,cv.height);im.src=S.A[id];}
  let col=PAL[1],size=10,erase=false,down=false,last=null,dirty=false;
  const tools=root.querySelector(`[data-dtools="${id}"]`);
  const drawTools=()=>{tools.innerHTML=PAL.map(c=>`<button class="sw${!erase&&c===col?' sel':''}" style="background:${c}" data-col="${c}" aria-label="цвет"></button>`).join('')+
    `<button class="dbtn${size===5?' sel':''}" data-size="5">тонко</button><button class="dbtn${size===10?' sel':''}" data-size="10">средне</button><button class="dbtn${size===22?' sel':''}" data-size="22">толсто</button><button class="dbtn${erase?' sel':''}" data-erase>ластик</button><button class="dbtn" data-clear>стереть всё</button>`;};
  drawTools();
  tools.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.col){col=b.dataset.col;erase=false;}else if(b.dataset.size)size=+b.dataset.size;else if('erase' in b.dataset)erase=!erase;else if('clear' in b.dataset){paint();S.A[id]=null;save();refreshDeps(id);updChain();const el=document.getElementById('q-'+id);if(el)el.classList.remove('ok');}drawTools();});
  const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  const line=(a,b2)=>{ctx.strokeStyle=erase?'#fffdf6':col;ctx.lineWidth=erase?size*2.2:size;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b2[0],b2[1]);ctx.stroke();};
  cv.addEventListener('pointerdown',e=>{down=true;last=pos(e);line(last,[last[0]+.1,last[1]+.1]);dirty=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);line(last,p);last=p;});
  const up=()=>{if(!down)return;down=false;if(dirty){const t=document.createElement('canvas');t.width=400;t.height=250;t.getContext('2d').drawImage(cv,0,0,400,250);S.A[id]=t.toDataURL('image/jpeg',.72);save();updChain();const el=document.getElementById('q-'+id);if(el)el.classList.add('ok');}};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',up);});}

// ——— отправка ———
function answerText(q,v){if(!has(v))return '';if(q.t==='draw')return '[рисунок]';if(q.t==='matrix')return Object.entries(v).map(([k,x])=>`${k}: ${x==='na'?q.na:x}`).join('; ');
  if(Array.isArray(v))return v.map(x=>x==='Своё'?'Своё: '+(S.A[q.id+'_other']||''):x).join('; ');if(q.t==='faces')return v+' — '+FACELAB[q.n||SV.faces][v-1];return String(v);}
function payload(){const answers={},qa=[];for(const s of SECS)for(const q of s.q){if(!visible(q)||!answered(q))continue;answers[q.id]=S.A[q.id];if(q.other&&S.A[q.id+'_other'])answers[q.id+'_other']=S.A[q.id+'_other'];qa.push([s.title,q.q,answerText(q,S.A[q.id])]);}
  return {form:'zc-opros-v1',age:SV.id,game:'final05',submittedAt:new Date().toISOString(),durationSec:Math.round((Date.now()-S.t0)/1000),answered:qa.length,total:visibleTotal(),answers,qa};}
const plain=p=>[`«Златая цепь» — опрос ${SV.age}`,`Отправлено: ${p.submittedAt}`,`Ответов: ${p.answered} из ${p.total}`,''].concat(p.qa.map(([s,q,a])=>`[${s}] ${q}\n→ ${a}`)).join('\n');
const sig=p=>JSON.stringify(p.answers);
let busy=false;
async function submit(){if(busy)return;const st=$('#status');const p=payload();
  if(S.sent&&S.sentSig===sig(p))return showStatus('good');
  if(!p.answered)return showStatus('empty');
  busy=true;let db=null,user=null,uid=null;
  try{if(window.claude&&window.claude.use){[db,user]=await Promise.all([window.claude.use('db').catch(()=>null),window.claude.use('user').catch(()=>null)]);}}catch(e){}
  try{if(user)uid=await user.id();}catch(e){uid=null;}
  if(!db||!uid){busy=false;return showStatus('local',p);}
  try{const c=user.can?await user.can('data.write'):null;if(c===false){busy=false;return showStatus('local',p,'noaccess');}}catch(e){}
  const add=()=>db.collection('responses/'+uid+'/entries').add(Object.assign({},p,S.sent?{revises:S.sent}:{}));
  try{let ref;try{ref=await add();}catch(err){if(err&&err.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*900));ref=await add();}else throw err;}
    S.sent=ref.id;S.sentSig=sig(p);save(true);
    db.doc('responses/'+uid).set({lastAt:p.submittedAt,lastAge:SV.id,lastEntry:ref.id}).catch(()=>{});
    busy=false;showStatus('good');fanfare();confetti();}
  catch(err){busy=false;showStatus('error',p,err&&err.code);}}
function showStatus(kind,p,code){const st=$('#status');if(!st)return;p=p||payload();const again=$('#againbtn');
  if(kind==='good'){st.className='status good';st.innerHTML=`<h4>✓ Ответы отправлены!</h4><p>${YOU?'Команда игры получит их вместе с остальными отзывами.':'Команда игры их уже получила. Ты молодец!'}</p><button class="linkbtn" data-act="save">Сохранить копию файлом</button>`;updChain();if(again)again.classList.remove('hidden');return;}
  if(kind==='empty'){st.className='status warn';st.innerHTML=`<h4>Пока нет ни одного ответа</h4><p>${YOU?'Вернитесь к вопросам — хотя бы несколько ответов нам очень помогут.':'Вернись к вопросам — ответь хотя бы на несколько!'}</p>`;return;}
  const why=kind==='error'?(code==='quota_exceeded'?'Хранилище ответов переполнено.':'Не получилось сохранить ответы на сервере.'):code==='noaccess'?'У этой ссылки нет права записывать ответы.':!window.claude?'Это копия опроса для работы без интернета — ответы не отправляются сами.':'Эта страница не подключена к хранилищу ответов.';
  st.className='status warn';st.innerHTML=`<h4>${kind==='error'?'Ответы не отправились':'Сохраните ответы, пожалуйста'}</h4>
    <p>${esc(why)} ${YOU||SV.id==='11-13'?'Скопируйте ответы или сохраните их файлом и перешлите организатору теста.':'Для взрослых: скопируйте ответы или сохраните файлом и перешлите организатору теста.'}</p>
    <div class="row"><button class="btn primary" data-act="copy">Скопировать ответы</button><button class="btn ghost" data-act="save">Сохранить файлом</button>${kind==='error'?'<button class="btn ghost" data-act="retry">Попробовать ещё раз</button>':''}</div><div id="copyout"></div>`;
  if(again)again.classList.remove('hidden');fanfare();confetti();}
async function copyAnswers(){const t=plain(payload());let ok=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t);ok=true;}}catch(e){ok=false;}
  const out=$('#copyout');if(!out)return;if(ok){out.innerHTML='<p style="margin-top:10px;font-weight:800">✓ Скопировано — вставьте в письмо или сообщение.</p>';}
  else{out.innerHTML='<p style="margin-top:10px">Выделите текст ниже и скопируйте его:</p><textarea readonly></textarea>';const ta=out.querySelector('textarea');ta.value=t;ta.focus();ta.select();}}
async function saveFile(){const p=payload(),name=`zlataya-cep_opros_${SV.id}_${p.submittedAt.slice(0,10)}.json`,data=JSON.stringify(p,null,1);
  let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads');}catch(e){dl=null;}
  if(dl){try{await dl.save({filename:name,data});return;}catch(e){if(e&&e.code==='declined')return;}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}catch(e){copyAnswers();}}
function confetti(){if(RM)return;const cv=document.createElement('canvas');cv.className='confetti';document.body.appendChild(cv);const c=cv.getContext('2d');const W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cols=['#f2b705','#e0a31a','#c8412b','#3f9b3a','#1d7fb8','#7b5cd6','#ff8fb3','#ffffff'];const P=Array.from({length:170},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*2.4,vy:2+Math.random()*3.5,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,w:6+Math.random()*7,h:4+Math.random()*6,c:cols[(Math.random()*cols.length)|0],ring:Math.random()<.18}));
  const t0=performance.now();(function fr(t){c.clearRect(0,0,W,H);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);
    if(p.ring){c.strokeStyle='#e0a31a';c.lineWidth=2.5;c.beginPath();c.ellipse(0,0,6,4,0,0,Math.PI*2);c.stroke();}else{c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);}c.restore();}
    if(t-t0<4800)requestAnimationFrame(fr);else cv.remove();})(t0);}

// ——— события ———
function wire(){const sc=$('#screen');
  document.addEventListener('click',e=>{
    const g=e.target.closest('[data-go]');if(g&&(g.closest('#screen')||g.closest('#links'))){go(+g.dataset.go);return;}
    const b=e.target.closest('#screen button[data-v]');if(b){const q=QMAP[b.closest('.q').dataset.qid];choose(q,b,e);return;}
    const sp=e.target.closest('[data-say]');if(sp){const k=sp.dataset.say;let t='';if(k==='intro')t=SV.intro.head+'. '+SV.intro.text;else if(k==='sec')t=SECS[S.sec].say;else if(k.startsWith('q:'))t=sayText(QMAP[k.slice(2)]);speak(t,sp);return;}
    const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
    if(act==='finish')go(N);else if(act==='copy')copyAnswers();else if(act==='save')saveFile();else if(act==='retry'){$('#status').className='status wait';$('#status').innerHTML='<span class="spin"></span>Отправляем ответы…';submit();}
    else if(act==='again'||act==='reset'){S=fresh();ls.set(KEY,S);go(-1);}
  });
  sc.addEventListener('input',e=>{const t=e.target;if(t.dataset.text){const q=QMAP[t.dataset.text],was=answered(q);S.A[q.id]=t.value;save();if(was!==answered(q)){t.closest('.q').classList.toggle('ok',answered(q));refreshDeps(q.id);updChain();}if(S.sent)S.sentSig=null;}
    else if(t.dataset.other){S.A[t.dataset.other+'_other']=t.value;save();}});
}
function start(data){S=(data&&data.A)?data:(ls.get(KEY)||fresh());if(!S.visited)S.visited={};if(!S.A)S.A={};if(!S.t0)S.t0=Date.now();
  initScene();wire();go(S.sec>=0&&S.sec<N&&data&&data.A?S.sec:-1,true);
  try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>S);}catch(e){}}
window.claude&&window.claude.hot&&window.claude.hot.ready?window.claude.hot.ready(start):start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
})();
</script>
