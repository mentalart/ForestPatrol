<style>
/* Раскладка: сцена на весь экран (стол с книгой), поверх — тонкие плашки из тёмного ореха с золотом по краям экрана. */
:root{
  --walnut:#20140d;          /* фон за столом */
  --glass:rgba(32,20,12,.74);/* плашки интерфейса */
  --line:rgba(232,194,122,.34);
  --ink:#f5e8cb;             /* текст */
  --muted:#c9b48e;
  --gold:#e8bf6a;            /* акцент: золото цепи */
  --gold-ink:#2a1a0c;
  --f-display:"Ruslan Display","Cormorant Garamond",Georgia,serif;
  --f-body:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--walnut);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.chip{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#top>*{pointer-events:auto}
#brand{padding:8px 14px 9px;display:flex;flex-direction:column;gap:1px}
#brand b{font-family:var(--f-display);font-weight:400;font-size:21px;color:var(--gold);letter-spacing:.02em;line-height:1.1}
#brand span{font-size:14px;color:var(--muted);letter-spacing:.06em}
#tools{display:flex;gap:8px;align-items:center}
#links{padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
#links svg{width:26px;height:18px}
#links.got{animation:got .7s ease}
@keyframes got{30%{transform:scale(1.12);border-color:var(--gold)}}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.icon{width:42px;height:42px;display:grid;place-items:center;padding:0}
.icon svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#nav{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:6px;max-width:100%;box-sizing:border-box}
#nav .arrow{width:44px;height:44px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;flex:none}
#nav .arrow:hover{background:rgba(232,191,106,.12)}
#nav .arrow:disabled{opacity:.3;cursor:default;background:transparent}
#nav .arrow svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#cap{min-width:0;width:300px;max-width:52vw;text-align:center;padding:0 4px;display:flex;flex-direction:column;gap:1px}
#cap small{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#cap strong{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--ink);line-height:1.15;text-wrap:balance}
#cap em{font-style:italic;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#go{border:0;border-radius:10px;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:17px;padding:0 16px;height:44px;flex:none;white-space:nowrap}
#go:hover{filter:brightness(1.08)}
#hint.off{opacity:0}
#hint{transition:opacity .6s;font-size:15px;color:var(--muted);text-align:center;text-wrap:balance;max-width:640px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,0);padding:10px 18px;font-size:19px;font-weight:700;color:var(--ink);
  opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-8px)}
#veil{position:fixed;inset:0;display:grid;place-items:center;background:var(--walnut);transition:opacity .8s;z-index:5}
#veil.off{opacity:0;pointer-events:none}
#veil p{font-family:var(--f-display);color:var(--gold);font-size:24px;letter-spacing:.04em}
@media (max-width:620px){
  #hint{display:none}
  #cap{width:auto;flex:1}
  #cap em{display:none}
  #cap strong{font-size:18px}
  #go{padding:0 12px;font-size:16px}
  #brand span{display:none}
}
@media (prefers-reduced-motion:reduce){#links.got{animation:none}#toast{transition:none}}

<body>

<script>
'use strict';
/* ====================================================================================
   Раскладная книга «Златая цепь»: три разворота — три мира игры
   (Дремучий лес, Подводный Китеж, Небесное царство). Three.js r128, всё рисуется на canvas.
   Механика: листы вращаются вокруг корешка (ось Z). У каждого разворота — своя рамка
   на корешке, повёрнутая по биссектрисе двух его страниц; ψ — половина угла раскрытия
   (π/2 — книга лежит раскрытой, 0 — сомкнута). Объёмные детали считаются от ψ:
   «V-слои» поперёк корешка складываются по сгибу, одиночные фигуры ложатся на свою страницу.
   ==================================================================================== */
(async()=>{
// холсты подписей рисуются шрифтами страницы — ждём их (без сети — запасной шрифт через 2,5 с)
try{await Promise.race([Promise.all(['50px "Ruslan Display"','700 22px "Cormorant Garamond"','italic 600 24px "Cormorant Garamond"'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))])}catch(e){}
const PI=Math.PI, clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const R=(a,b)=>a+(b-a)*rnd();

/* ---------- размеры книги (метры сцены) ---------- */
const W=1.45, DZ=1.25, OVH=.035, OVZ=.04, TH=[.03,.012,.012,.03];
const PXU=560;                         // пикселей холста на единицу для вырезок

/* ---------- рендер, сцена ---------- */
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#1c110a');
scene.fog=new THREE.Fog('#1c110a',7,16);
const camera=new THREE.PerspectiveCamera(34,1,.05,60);
const MAXANI=renderer.capabilities.getMaxAnisotropy();

scene.add(new THREE.HemisphereLight('#fff0d8','#3b2414',.62));
const sun=new THREE.DirectionalLight('#ffe7c4',1.25);
sun.position.set(-2.1,4.4,2.9);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-2.3,right:2.3,top:2.3,bottom:-2.3,near:.5,far:12});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.012;
scene.add(sun);
const fill=new THREE.DirectionalLight('#cfdcff',.28);fill.position.set(3,2,-1);scene.add(fill);

/* ---------- холсты ---------- */
function cv(w,h){const c=document.createElement('canvas');c.width=Math.max(2,Math.round(w));c.height=Math.max(2,Math.round(h));return c}
const NOISE=(()=>{const c=cv(160,160),x=c.getContext('2d'),d=x.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){const v=200+rnd()*55|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
  x.putImageData(d,0,0);return c})();
function grain(c,a=.16){const x=c.getContext('2d');x.save();x.globalCompositeOperation='multiply';x.globalAlpha=a;
  x.fillStyle=x.createPattern(NOISE,'repeat');x.fillRect(0,0,c.width,c.height);
  x.globalCompositeOperation='destination-in';x.globalAlpha=1;x.drawImage(c,0,0);x.restore();}
// бумажная кромка вокруг силуэта (вырубка) — светлая, на 3 px
function rim(c,px=3,col='#f6eedc'){const t=cv(c.width,c.height),x=t.getContext('2d');
  for(let i=0;i<16;i++){const a=i/16*PI*2;x.drawImage(c,Math.cos(a)*px,Math.sin(a)*px)}
  x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,t.width,t.height);
  x.globalCompositeOperation='source-over';x.drawImage(c,0,0);return t}
function tex(c){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=MAXANI;return t}

/* ---------- примитивы рисования ---------- */
const g2={
  ell(x,cx,cy,rx,ry,f,r=0){x.beginPath();x.ellipse(cx,cy,Math.abs(rx),Math.abs(ry),r,0,PI*2);x.fillStyle=f;x.fill()},
  poly(x,p,f){x.beginPath();x.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)x.lineTo(p[i],p[i+1]);x.closePath();x.fillStyle=f;x.fill()},
  rr(x,a,b,w,h,r,f){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();x.fillStyle=f;x.fill()},
  line(x,p,w,c,cap='round'){x.beginPath();x.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)x.lineTo(p[i],p[i+1]);x.lineWidth=w;x.strokeStyle=c;x.lineCap=cap;x.lineJoin='round';x.stroke()},
  sh(x,on,b=7,oy=3,a=.22){x.shadowColor=on?`rgba(20,10,0,${a})`:'transparent';x.shadowBlur=on?b:0;x.shadowOffsetY=on?oy:0;x.shadowOffsetX=0},
  vgrad(x,y0,y1,stops){const g=x.createLinearGradient(0,y0,0,y1);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));return g},
  text(x,s,cx,cy,font,col,align='center'){x.font=font;x.fillStyle=col;x.textAlign=align;x.textBaseline='middle';x.fillText(s,cx,cy)},
};
const {ell,poly,rr,line,sh,vgrad,text}=g2;
function star5(x,cx,cy,r1,r2,f,rot=-PI/2){const p=[];for(let i=0;i<10;i++){const r=i%2?r2:r1,a=rot+i*PI/5;p.push(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}poly(x,p,f)}
function sparkle(x,cx,cy,r,f){poly(x,[cx,cy-r,cx+r*.22,cy-r*.22,cx+r,cy,cx+r*.22,cy+r*.22,cx,cy+r,cx-r*.22,cy+r*.22,cx-r,cy,cx-r*.22,cy-r*.22],f)}
function puff(x,cx,cy,r,f,n=5){for(let i=0;i<n;i++){const a=i/(n-1);ell(x,cx+(a-.5)*r*2.6,cy+Math.sin(a*PI)*-r*.55+r*.25,r*(.6+Math.sin(a*PI)*.5),r*(.55+Math.sin(a*PI)*.45),f)}}
function fir(x,cx,by,w,h,c1,c2,trunk='#5a3b22'){
  x.fillStyle=trunk;x.fillRect(cx-w*.06,by-h*.13,w*.12,h*.13);
  for(let i=0;i<4;i++){const t=i/4,yb=by-h*.1-h*.9*t*.78,ww=w*(1-t*.62)/2,hh=h*.38;
    poly(x,[cx-ww,yb,cx+ww,yb,cx,yb-hh],i%2?c2:c1);poly(x,[cx-ww,yb,cx-ww*.15,yb,cx,yb-hh],'rgba(0,0,0,.10)')}
}
function onion(x,cx,by,w,h,col,hi,cross=true){
  x.beginPath();x.moveTo(cx-w*.5,by);
  x.bezierCurveTo(cx-w*.62,by-h*.45,cx-w*.08,by-h*.62,cx,by-h);
  x.bezierCurveTo(cx+w*.08,by-h*.62,cx+w*.62,by-h*.45,cx+w*.5,by);x.closePath();x.fillStyle=col;x.fill();
  ell(x,cx-w*.16,by-h*.42,w*.08,h*.2,hi,.3);
  if(cross){line(x,[cx,by-h,cx,by-h*1.32],w*.07,'#f5d26a');line(x,[cx-w*.13,by-h*1.2,cx+w*.13,by-h*1.2],w*.06,'#f5d26a')}
}
function scallopTopPath(x,W,H,top,r,amp=0){x.beginPath();x.moveTo(0,H);x.lineTo(0,top);
  const n=Math.ceil(W/(r*2));for(let i=0;i<n;i++){const a=i*W/n,b=(i+1)*W/n,yy=top+Math.sin(i*1.7)*amp;x.quadraticCurveTo((a+b)/2,yy-r*1.1,b,top)}
  x.lineTo(W,H);x.closePath()}
// холст вырезки: размеры в единицах сцены, draw(x,w,h) рисует в пикселях
function art(wu,hu,draw,o={}){const c=cv(wu*PXU,hu*PXU),x=c.getContext('2d');draw(x,c.width,c.height);
  let r=o.rim===false?c:rim(c,o.rim||3);grain(r,o.grain??.14);r.wu=wu;r.hu=hu;return r}

/* ---------- герои «Лесного патруля» (рисунок в поле 100×140, низ — ноги) ---------- */
function hero(kind){return(x,w,h)=>{x.save();const s=Math.min(w/100,h/140);x.translate(w/2-50*s,h-140*s-4);x.scale(s,s);sh(x,true,4,2,.18);HERO[kind](x);x.restore()}}
const HERO={
  fox(x){ // Прошка: лисёнок-изобретатель, очки на лбу, рогатка
    ell(x,80,92,15,33,'#e2712c',-.65);ell(x,92,66,9,12,'#fff3e2',-.65);
    rr(x,38,116,9,22,4,'#4a2a17');rr(x,54,116,9,22,4,'#4a2a17');
    ell(x,51,98,22,25,'#e8772e');ell(x,51,104,13,17,'#fbe9d2');
    poly(x,[33,80,69,80,62,90,51,86,40,90],'#3f8f5a');
    ell(x,29,97,6,13,'#e8772e',.45);ell(x,73,97,6,13,'#e8772e',-.45);
    line(x,[22,108,18,90],3.5,'#6b3d1f');line(x,[18,90,12,80],3,'#6b3d1f');line(x,[18,90,25,81],3,'#6b3d1f');line(x,[12,80,25,81],1.2,'#2b1a0e');
    poly(x,[30,48,35,16,49,40],'#e8772e');poly(x,[72,48,67,16,53,40],'#e8772e');
    poly(x,[33,44,36,24,44,39],'#5a2c14');poly(x,[69,44,66,24,58,39],'#5a2c14');
    ell(x,51,58,25,21,'#ee8434');ell(x,51,69,14,10,'#fff3e2');
    ell(x,42,43,6,6,'#c9a14a');ell(x,60,43,6,6,'#c9a14a');ell(x,42,43,3.8,3.8,'#9fd8f2');ell(x,60,43,3.8,3.8,'#9fd8f2');line(x,[48,43,54,43],2,'#8a6a2a');
    ell(x,42,57,3.6,4.4,'#24160c');ell(x,60,57,3.6,4.4,'#24160c');ell(x,43,55.5,1.2,1.2,'#fff');ell(x,61,55.5,1.2,1.2,'#fff');
    ell(x,51,66,4,3,'#24160c');line(x,[47,72,51,74,55,72],1.6,'#7a3c18');
  },
  bear(x){ // Потап: медвежонок-силач в красной рубахе
    rr(x,33,116,14,22,6,'#5e3b22');rr(x,53,116,14,22,6,'#5e3b22');
    ell(x,50,97,29,28,'#c8342b');poly(x,[36,74,64,74,58,86,50,80,42,86],'#e6b955');
    rr(x,22,105,56,6,3,'#e6b955');for(let i=0;i<5;i++)ell(x,30+i*10,108,2,2,'#c8342b');
    ell(x,20,94,9,16,'#8a5a35',.35);ell(x,80,94,9,16,'#8a5a35',-.35);
    ell(x,28,33,10,10,'#8a5a35');ell(x,72,33,10,10,'#8a5a35');ell(x,28,33,5.5,5.5,'#d9b48a');ell(x,72,33,5.5,5.5,'#d9b48a');
    ell(x,50,52,27,23,'#8f5d37');ell(x,50,63,13,10,'#d9b48a');
    ell(x,40,48,3.6,4.2,'#24160c');ell(x,60,48,3.6,4.2,'#24160c');ell(x,41,46.6,1.2,1.2,'#fff');ell(x,61,46.6,1.2,1.2,'#fff');
    ell(x,50,58,5.5,3.8,'#24160c');line(x,[45,66,50,69,55,66],1.8,'#5e3b22');
    ell(x,34,58,4,2.5,'rgba(230,110,110,.45)');ell(x,66,58,4,2.5,'rgba(230,110,110,.45)');
  },
  owl(x){ // Пелагея: совушка-сказительница с тетрадкой
    poly(x,[38,124,44,124,41,136],'#e58a2e');poly(x,[56,124,62,124,59,136],'#e58a2e');
    ell(x,50,92,30,36,'#cf6f9d');ell(x,50,100,19,24,'#f3c6dc');
    for(let r=0;r<3;r++)for(let i=0;i<3;i++)line(x,[42+i*8-3,90+r*9,42+i*8,93+r*9,42+i*8+3,90+r*9],1.5,'#c9709b');
    ell(x,22,96,9,22,'#b2588a',.25);ell(x,78,96,9,22,'#b2588a',-.25);
    rr(x,64,96,18,14,2,'#3e6db5');line(x,[73,97,73,109],1.2,'#dfe8ff');

function layout(t,dt){

    const py=lerp(hR,hL+TH[i],f[i]);leaves[i].py=py;leaves[i].g.position.set(0,py,0);leaves[i].g.rotation.z=theta[i]}
  spine.scale.y=Math.max(TH[0],leaves[0].py+TH[0]*(1-f[0]));
  bookRoot.position.x=-(W/2)*(1-smooth(f[0]));
  spreads.forEach((sp,n)=>{
    const ta=theta[n],tb=theta[n+1],a=leaves[n],b=leaves[n+1];

      for(let r=0;r<2;r++)for(let ci=0;ci<3;ci++){const sx=cols[ci],v=r*L.h,o=(r*3+ci)*3;p[o]=sx*s;p[o+1]=Math.abs(sx)*c+v*s+.003;p[o+2]=L.z+v*c}

    const hit=pick(e,pickable);if(hit){if(cur<0||hit.point.x>.02)next();else prev()}}
  drag=null;canvas.style.cursor='grab'}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('dblclick',resetView);
canvas.addEventListener('wheel',e=>{e.preventDefault();view.zoom=clamp(view.zoom*Math.exp(e.deltaY*.0012),.55,1.5)},{passive:false});

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const tgt=new THREE.Vector3();
function placeCamera(t){
  const o=smooth(theta[0]/PI);
  for(const k of ['yaw','pitch','zoom'])vs[k]=lerp(vs[k],view[k],.12);
  const sway=REDUCED?0:Math.sin(t*.23)*.035;
  const tall=clamp((1-camera.aspect)*.35,0,.22);   // на узком экране смотрим выше — книга занимает больше места
  const yaw=lerp(-.55,0,o)+vs.yaw+sway, pol=clamp(lerp(.82,.96,o)-tall+vs.pitch,.35,1.38);
  // расстояние подбираем под ширину окна, чтобы книга помещалась и на телефоне
  const hf=2*Math.atan(Math.tan(camera.fov*PI/360)*camera.aspect),need=lerp(2.0,3.25,o)/2/Math.tan(hf/2);
  const rad=Math.max(lerp(2.75,3.65,o),need*1.02)*vs.zoom;
  tgt.set(0,lerp(.04,.27,o),lerp(0,-.04,o));
  scene.fog.near=rad+2.5;scene.fog.far=rad+12;
  camera.position.set(tgt.x+Math.sin(yaw)*Math.sin(pol)*rad,tgt.y+Math.cos(pol)*rad,tgt.z+Math.cos(yaw)*Math.sin(pol)*rad);
  camera.lookAt(tgt)}

/* ---------- цикл ---------- */
let tPrev=now();
function frame(){const t=now(),dt=Math.min(.05,t-tPrev);tPrev=t;
  stepAnims();layout(t,dt);stepBursts(dt);placeCamera(t);renderer.render(scene,camera);requestAnimationFrame(frame)}
ui();canvas.style.cursor='grab';
requestAnimationFrame(frame);
setTimeout(()=>$('veil').classList.add('off'),120);
// для проверок: KNIGA.go(n) — открыть разворот n сразу (−1 — закрыта), KNIGA.set(i,угол)
window.KNIGA={go(n){anims.length=0;for(let i=0;i<4;i++)theta[i]=i<=n?PI:0;cur=n;ui()},set(i,a){anims.length=0;theta[i]=a},theta,spreads,collect:i=>collect(spreads[i].link)};
})();
</script>
