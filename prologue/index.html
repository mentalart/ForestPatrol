<title>Златая цепь — Пролог «Звенышко» (3D greybox)</title>
<!--
==========================================================================================
 ЗЛАТАЯ ЦЕПЬ — глава «0 · Пролог. Звенышко», играбельный 3D greybox (кооп на двоих: одна клавиатура
 и/или два джойстика). Собран по сценарию v4 (раздел «0 · Пролог. Звенышко», ≈ 8 мин) на движке
 вертикального среза (index_2.html): тот же стек, камера, деление экрана, герои-примитивы, язык боя.
 Состав: Штаб-сосна (ходьба) -> ролик «Колыбельная» -> погоня по веткам (прыжок; Смена: уступ /
         овраг / корень) -> старая калитка (свой приём: рогатка Прошки, ковшик Йоши) -> тропинки
         расходятся (экран делится и сливается) -> жёлтые плиты с лапкой («оставленный держит»)
         -> первый морок (щит, отбив, «Одним махом», Пробой, Добивающий мах, строчка колыбельной)
         -> светящееся дупло -> ролик «Лукоморье» (пустой дуб, присказка Кота) -> карта-рушник.
 Стек:   один HTML + Three.js r128 с CDN. Никаких других зависимостей.

 ЧТО ВЗЯТО ИЗ СЦЕНАРИЯ v4 (и чем глава отличается от среза index_2):
  - Раскладка джойстика по v4: A прыжок · B защита · X удар · Y смена · RT свой приём · крестовина ↑
    «Ко мне!». RB (чудо-вещь) и LT (кувырок) в прологе ещё не нужны — открываются в 1-1 и 1-2.
    Клавиатура — как в срезе (таблица v4): Игрок 1 WASD/Пробел/F/G/Q/E/1, Игрок 2 стрелки/M/,/./K/L/0.
  - Умения по v4: Прошка — высокий прыжок и рогатка (жёлудь летит сам в метку); Пелагея — планирует,
    пока держишь прыжок; Йоша — пролезает в лазы, ковшик живой воды; Потап — тяжёлый, широкий щит.
    Подкидка Потапа и Совиный взор Пелагеи в прологе закрыты (открываются в мире 1).
  - Бой по v4: запал — угольки ГАСНУТ; одна кнопка защиты, три ступени: щит (заранее, тратит дух) →
    отбив (последние 0,35/0,25/0,15 с) → «Одним махом» (0,15/0,1/0,06 с). Первые три встречи с сигналом
    на Лёгком и Среднем пути — замедление вдвое и картинка кнопки. Первый морок не ранит.
  - Три пути сложности у каждого игрока (Лёгкий / Средний / Богатырский): сигнал за 0,7 / 0,5 / 0,35 с.
  - Каждое действие впервые показывается рисунком кнопки над тем героем, которому оно нужно.
  - Подсказчик — Звенышко: 20 с без продвижения — подлетает к нужному месту и звенит; 40 с — призрак.
  - Ролики с пропуском: оба игрока держат A (на клавиатуре — Пробел и M). Субтитры отключаемы.
  - «Держись за меня»: три падения в одном месте — прыжок, и герой цепляется за героя напарника до
    следующего колокольчика. Оставленный, отставший больше чем на 30 м, подтягивается Звенышком сам.

 ИЗВЕСТНЫЕ ОГРАНИЧЕНИЯ / ЗАГЛУШКИ:
  - Весь арт — примитивы Three.js (Lambert), без текстур и скелетной анимации; анимация процедурная.
  - Озвучки нет: голоса — «бормотание» тонами AudioContext под субтитры; колыбельная — синтез-мелодия.
  - Окно в сосне — плоская «диорама» (луна и тень Кощея), а не настоящий проём.
  - Учебные ворота с плитами открыты, пока плиту держат, и открываются насовсем, когда через них прошли
    ОБА героя игрока — иначе сцена сценария «ворота держит уже он» теряет смысл (в мирах — после первого).
  - Искры собираются и считаются (алая возвращает лепесток), но синей шкалы и богатырского выхода нет.
  - Одиночный «Паровозик», сохранения, вход/выход второго игрока на лету, реплики 12×5 — не входят.
  - Лукоморье — поляна, пустой дуб, Кот и раскатка карты-рушника; кузня и лавка — только силуэты.
  - Ролики короче бюджета сценария: «Колыбельная» ≈ 40 с (в сценарии 60), «Лукоморье» ≈ 25 с (45) —
    без озвучки длинные паузы не держатся; тайминги реплик размечены для будущей записи голоса.
  - Физика — AABB/цилиндры, без склонов; потолок учитывается только для прыжка (лаз в корне).
  - Длительность на опытной паре ≈ 7–10 минут вместе с роликами (цель сценария ≈ 8 минут).
 Отладка: объект window.ZC (G, players, loadLevel, sim) — только для тестов, в релизе убрать.
==========================================================================================
-->
<style>

<div id="ui">

  <div id="divider"></div>
  <div id="icons"></div><div id="floats"></div><div id="bubs"></div>
  <div class="hud" id="hud0"></div><div class="hud" id="hud1"></div><div id="links"><i></i><span></span></div>
  <div class="tip" id="tip0"></div><div class="tip" id="tip1"></div>

  <div id="skip"><span>Пропуск — оба держат</span><span class="k0"></span><span class="dot" id="sk0"></span><span class="k1"></span><span class="dot" id="sk1"></span><span class="bar"><i id="skbar"></i></span></div>
  <div id="fade"></div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('card').innerHTML='<h1>Златая цепь</h1><p>Не удалось загрузить Three.js (r128) с CDN. Проверьте подключение к интернету и обновите страницу.</p>';return;}

/* ============================== УТИЛИТЫ ============================== */
const V3=THREE.Vector3;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a);
const damp=(a,b,k,dt)=>a+(b-a)*(1-Math.exp(-k*dt));
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const hd=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
function angDamp(a,b,k,dt){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return a+d*(1-Math.exp(-k*dt));}
const $=id=>document.getElementById(id);
const GRAV=25, STEP=0.36;
const COL={p1:0xd9774a,p2:0x2fb3aa,yellow:0xffd23a,red:0xff3b30,blue:0x2f7bff,gold:0xffc93c,wood:0x8a5a32};
const PCOL=[COL.p1,COL.p2], PCSS=['#d9774a','#2fb3aa'];
// Три пути сложности (v4): вспышка до удара, окна отбива и маха, длина Пробоя, цена щита в «духе»
const PATHS=['easy','mid','hard'],PATHNAME={easy:'Лёгкий путь',mid:'Средний путь',hard:'Богатырский путь'};
const TIMING={easy:{lead:0.7,parry:0.35,mah:0.15,broken:6,cost:0.17},mid:{lead:0.5,parry:0.25,mah:0.1,broken:4,cost:0.34},hard:{lead:0.35,parry:0.15,mah:0.06,broken:4,cost:0.34}};

/* ============================== ВВОД ============================== */
const BIND=[
 {up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD',jump:'Space',attack:'KeyF',guard:'KeyG',swap:'KeyQ',roll:'ShiftLeft',skill:'KeyE',item:'KeyR',call:'Digit1'},
 {up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',jump:'KeyM',attack:'Comma',guard:'Period',swap:'KeyK',roll:'Slash',skill:'KeyL',item:'Semicolon',call:'Digit0'}];
const KEYNAME={KeyW:'W',KeyA:'A',KeyS:'S',KeyD:'D',Space:'Пробел',KeyF:'F',KeyG:'G',KeyQ:'Q',ShiftLeft:'Shift',KeyE:'E',KeyR:'R',Digit1:'1',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',KeyM:'M',Comma:',',Period:'.',KeyK:'K',Slash:'/',KeyL:'L',Semicolon:';',Digit0:'0'};
const PADG={jump:['A','A'],guard:['B','B'],attack:['X','X'],swap:['Y','Y'],skill:['RT','T'],item:['RB','T'],roll:['LT','T'],call:['✚↑','D']};
const padGlyph=a=>'<span class="pb '+PADG[a][1]+'">'+PADG[a][0]+'</span>';
const STICK='<span class="stick"></span>';
const K=(pi,a)=>PADS.gp[pi]?padGlyph(a):'<kbd>'+KEYNAME[BIND[pi][a]]+'</kbd>';
const MOVEK=pi=>PADS.gp[pi]?STICK:(pi?'<kbd>↑←↓→</kbd>':'<kbd>WASD</kbd>');
const ALL=new Set(); BIND.forEach(b=>Object.values(b).forEach(c=>ALL.add(c)));
const down=new Set(), pressed=new Set();
addEventListener('keydown',e=>{
  if(ALL.has(e.code)||e.code==='Enter'||e.code==='Escape'||e.code==='Tab') e.preventDefault();
  if(!e.repeat) pressed.add(e.code);
  down.add(e.code); initAudio();
});
addEventListener('keyup',e=>down.delete(e.code));
addEventListener('blur',()=>down.clear());
const btn=(pi,a)=>down.has(BIND[pi][a])||PADS.down.has(BIND[pi][a]);
const tap=(pi,a)=>pressed.has(BIND[pi][a]);

/* ============================== ДЖОЙСТИКИ (Gamepad API, стандартная раскладка, раскладка v4) ============================== */
const PADS={down:new Set(),axes:[{x:0,y:0},{x:0,y:0}],gp:[null,null],slots:[false,false],swap:false,count:0};
// A=прыжок, B=защита, X=удар, Y=смена, RB=чудо-вещь, LT=кувырок, RT=свой приём, крестовина ↑=«Ко мне!», Back=поменять джойстики (в меню), Start=пауза
const PADMAP=[[0,'jump'],[1,'guard'],[2,'attack'],[3,'swap'],[5,'item'],[6,'roll'],[7,'skill'],[12,'call']];
function pollPads(){let list=[];try{if(navigator.getGamepads)list=Array.from(navigator.getGamepads()).filter(g=>g&&g.connected!==false);}catch(e){list=[];}
  list.sort((a,b)=>a.index-b.index);const nd=new Set();PADS.gp=[null,null];
  for(let slot=0;slot<2;slot++){const gp=list[slot];PADS.slots[slot]=!!gp;const pi=PADS.swap?1-slot:slot;PADS.axes[pi]={x:0,y:0};if(!gp)continue;PADS.gp[pi]=gp;

let stitchT=0;function stitch(){stitchT=0.55;}   // «кадр на миг вышит нитью»

/* ============================== КОЛЛИЗИИ ============================== */
function collideXZ(x,z,r,feet,top,skipMovers){let hit=false;
  for(const b of W.boxes){if(!b.on||b.maxy<=feet+STEP||b.miny>=top)continue;if(x<b.minx-r||x>b.maxx+r||z<b.minz-r||z>b.maxz+r)continue;
   const cx=clamp(x,b.minx,b.maxx),cz=clamp(z,b.minz,b.maxz),dx=x-cx,dz=z-cz,d2=dx*dx+dz*dz;if(d2>=r*r)continue;hit=true;
   if(d2>1e-9){const d=Math.sqrt(d2);x=cx+dx/d*r;z=cz+dz/d*r;}
   else{const pl=x-b.minx,pr=b.maxx-x,pb=z-b.minz,pf=b.maxz-z,m=Math.min(pl,pr,pb,pf);if(m===pl)x=b.minx-r;else if(m===pr)x=b.maxx+r;else if(m===pb)z=b.minz-r;else z=b.maxz+r;}}
  for(const c of W.cyls){if(!c.on||c.maxy<=feet+STEP||c.miny>=top)continue;const dx=x-c.x,dz=z-c.z,rr=r+c.r,d2=dx*dx+dz*dz;if(d2>=rr*rr)continue;
   hit=true;const d=Math.sqrt(d2)||1e-4;x=c.x+dx/d*rr;z=c.z+dz/d*rr;}
  return {x,z,hit};}
function groundAt(x,z,reach,m){m=m===undefined?0.12:m;let y=-1e9,ref=null;
  for(const b of W.boxes){if(!b.on||b.maxy>reach)continue;if(x<b.minx-m||x>b.maxx+m||z<b.minz-m||z>b.maxz+m)continue;if(b.maxy>y){y=b.maxy;ref=b;}}
  for(const c of W.cyls){if(!c.on||c.maxy>reach)continue;const dx=x-c.x,dz=z-c.z;if(dx*dx+dz*dz>(c.r+m)*(c.r+m))continue;if(c.maxy>y){y=c.maxy;ref=c;}}
  return {y,ref};}
// потолок над головой (для прыжка в низком лазе): самый низкий низ коробки выше макушки
function ceilingAt(x,z,r,top){let c=1e9;for(const b of W.boxes){if(!b.on||b.miny<top-0.02)continue;if(x<b.minx-r*0.5||x>b.maxx+r*0.5||z<b.minz-r*0.5||z>b.maxz+r*0.5)continue;if(b.miny<c)c=b.miny;}return c;}
function segBox(p,q,b){let t0=0,t1=1;const d=[q.x-p.x,q.y-p.y,q.z-p.z],o=[p.x,p.y,p.z],mn=[b.minx,b.miny,b.minz],mx=[b.maxx,b.maxy,b.maxz];
  for(let i=0;i<3;i++){if(Math.abs(d[i])<1e-9){if(o[i]<mn[i]||o[i]>mx[i])return false;}else{let ta=(mn[i]-o[i])/d[i],tb=(mx[i]-o[i])/d[i];if(ta>tb){const s=ta;ta=tb;tb=s;}t0=Math.max(t0,ta);t1=Math.min(t1,tb);if(t0>t1)return false;}}return true;}
function segCyl(p,q,c){const dx=q.x-p.x,dz=q.z-p.z,l2=dx*dx+dz*dz;let t=l2>0?((c.x-p.x)*dx+(c.z-p.z)*dz)/l2:0;t=clamp(t,0,1);const x=p.x+dx*t-c.x,z=p.z+dz*t-c.z;return x*x+z*z<c.r*c.r&&Math.min(p.y,q.y)<c.maxy&&Math.max(p.y,q.y)>c.miny;}
function occluded(a,b){const p=new V3(a.pos.x,a.pos.y+0.9,a.pos.z),q=new V3(b.pos.x,b.pos.y+0.9,b.pos.z);
  for(const bx of W.boxes)if(bx.on&&bx.occ&&segBox(p,q,bx))return true;for(const c of W.cyls)if(c.on&&c.occ&&segCyl(p,q,c))return true;return false;}
function pathBlocked(a,b){ // закрытые ворота и глухие стены — оставленного через них не переносит
  const p=new V3(a.x,Math.max(a.y,b.y)+0.9,a.z),q=new V3(b.x,Math.max(a.y,b.y)+0.9,b.z);
  for(const g of W.gates)if(g.col.on&&segBox(p,q,g.col))return true;for(const nb of W.noCarry)if(segBox(p,q,nb))return true;
  for(const bx of W.boxes)if(bx.on&&bx.occ&&segBox(p,q,bx))return true;for(const c of W.cyls)if(c.on&&c.occ&&segCyl(p,q,c))return true;return false;}

/* ============================== ФИЗИКА ГЕРОЯ ============================== */
function moveHero(h,dt,wx,wz,speed){const k=h.grounded?12:4.5;h.vel.x=damp(h.vel.x,wx*speed,k,dt);h.vel.z=damp(h.vel.z,wz*speed,k,dt);}
function integrate(h,dt){
  h.vel.y-=GRAV*dt;if(h.glide&&h.vel.y<-1.9)h.vel.y=-1.9;if(h.vel.y<-30)h.vel.y=-30;
  const r=h.d.radius,hh=heroHeight(h);
  const res=collideXZ(h.pos.x+h.vel.x*dt,h.pos.z+h.vel.z*dt,r,h.pos.y,h.pos.y+hh);h.pos.x=res.x;h.pos.z=res.z;h.blocked=res.hit;
  if(h.active)for(const e of W.enemies){if(!e.alive)continue;const dx=h.pos.x-e.pos.x,dz=h.pos.z-e.pos.z,d=Math.hypot(dx,dz),rr=r+e.r;if(d<rr&&d>1e-4){h.pos.x=e.pos.x+dx/d*rr;h.pos.z=e.pos.z+dz/d*rr;}}
  if(W.clampR){const c=W.clampR,dx=h.pos.x-c.x,dz=h.pos.z-c.z,d=Math.hypot(dx,dz);if(d>c.r){h.pos.x=c.x+dx/d*c.r;h.pos.z=c.z+dz/d*c.r;}}
  const prevY=h.pos.y;let ny=prevY+h.vel.y*dt;const reach=h.grounded?prevY+STEP:prevY+0.02;const g=groundAt(h.pos.x,h.pos.z,reach);
  if(ny<=g.y&&h.vel.y<=0.001){if(!h.grounded){if(-h.vel.y>9&&h.active){shake(h.player,0.03,0.18);SFX.land();}}
    ny=g.y;h.vel.y=0;h.grounded=true;h.groundRef=g.ref;h.lastGroundY=g.y;h.coyote=0.12;}
  else if(h.grounded&&h.vel.y<=0&&g.y>prevY-0.3&&g.y<=reach){ny=g.y;h.vel.y=0;h.groundRef=g.ref;}
  else{h.grounded=false;h.groundRef=null;}
  h.pos.y=ny;if(h.pos.y<-9)onFall(h);}
function placeOnGround(h,x,z,yHint){h.pos.set(x,yHint+0.05,z);const g=groundAt(x,z,yHint+1.5,0.3);h.pos.y=g.y>-1e8?g.y:yHint;h.vel.set(0,0,0);h.grounded=true;h.groundRef=g.ref;h.lastGroundY=h.pos.y;}
function onFall(h){ // падение: без урона, назад к колокольчику своего игрока; три падения в одном месте — «Держись за меня»
  const p=players[h.player];
  if(h.active){G.stats.falls++;const now=G.time;p.falls=p.falls.filter(f=>now-f.t<240);const near=p.falls.filter(f=>Math.hypot(f.x-h.pos.x,f.z-h.pos.z)<7).length;p.falls.push({x:h.pos.x,z:h.pos.z,t:now});
    if(near>=2&&!p.clingOffer){p.clingOffer=true;tip(h.player,'Трудное место? Над героем колечко: прыжок '+K(h.player,'jump')+' — и он уцепится за друга до колокольчика',4.5);}
    else tip(h.player,'Упс! Назад к колокольчику — лепестки целы',2.2);}
  const k=p.heroes.indexOf(h);placeOnGround(h,p.cp.x+(k?1.2:-0.4),p.cp.z,p.cp.y);h.iT=1;h.following=false;burst(h.pos.clone().add(new V3(0,0.6,0)),0xffffff,8,3);}
function teleportBehind(o,h){const tx=h.pos.x-Math.sin(h.face)*1.2,tz=h.pos.z-Math.cos(h.face)*1.2;const g=groundAt(tx,tz,h.pos.y+0.5,0);
  if(g.y>h.pos.y-0.5)placeOnGround(o,tx,tz,h.pos.y);else placeOnGround(o,h.pos.x,h.pos.z,h.pos.y);o.stuck=0;burst(o.pos.clone().add(new V3(0,0.5,0)),COL.gold,8,2);}

/* ============================== ДЕЙСТВИЯ ИГРОКОВ ============================== */
function camBack(){return new V3(Math.sin(W.camYaw),0,Math.cos(W.camYaw));}
function updatePlayer(pi,dt){
  const p=players[pi],h=active(pi),o=other(pi);p.spiritLock=Math.max(0,p.spiritLock-dt);p.lockedTip=Math.max(0,p.lockedTip-dt);if(!h.guard)p.spirit=Math.min(1,p.spirit+dt*0.3);
  if(h.cling){updateCling(pi,h);updateLeftBehind(p,o,dt);return;}
  const lock=!!(G.cine||G.trans);let ix=0,iz=0;
  if(!lock&&h.knockT<=0){if(btn(pi,'right'))ix+=1;if(btn(pi,'left'))ix-=1;if(btn(pi,'up'))iz+=1;if(btn(pi,'down'))iz-=1;const pa=PADS.axes[pi];if(pa.x||pa.y){ix+=pa.x;iz-=pa.y;}}
  const back=camBack(),right=new V3(back.z,0,-back.x);let wx=right.x*ix-back.x*iz,wz=right.z*ix-back.z*iz;const wl=Math.hypot(wx,wz);if(wl>1){wx/=wl;wz/=wl;}
  if(!lock){if(tap(pi,'swap'))doSwap(pi);if(tap(pi,'call'))doCall(pi);}
  const hh=active(pi);if(hh!==h){updateLeftBehind(p,other(pi),dt);return;}
  h.guard=!lock&&btn(pi,'guard')&&p.spiritLock<=0;
  // момент нажатия защиты запоминается во времени морока: по нему решается щит / отбив / «Одним махом»
  if(!lock&&tap(pi,'guard'))for(const e of W.enemies)if(e.alive&&e.pi===pi&&e.state==='wind')e.left=e.wdur-e.t;
  if(!lock&&tap(pi,'attack')&&h.atkCd<=0){h.atkT=0.28;h.atkCd=0.36;SFX.swish();heroAttack(h,h.d.range,0.2);}
  if(!lock&&tap(pi,'skill'))doSkill(pi,h);
  if(!lock&&tap(pi,'jump')){if(p.clingOffer&&h.grounded)startCling(pi,h);else doJump(h);}
  h.glide=h.kind==='pelageya'&&!lock&&!h.grounded&&btn(pi,'jump')&&h.vel.y<0;
  let sp=h.d.speed;if(h.guard)sp*=0.35;if(h.atkT>0)sp*=0.5;
  if(h.knockT<=0)moveHero(h,dt,wx,wz,sp);
  if(wl>0.1)h.face=angDamp(h.face,Math.atan2(wx,wz),h.guard?7:13,dt);
  h.moving=wl>0.1;if(!h.grounded)h.coyote-=dt;
  updateLeftBehind(p,o,dt);}
function doJump(h){if(!(h.grounded||h.coyote>0))return;const top=h.pos.y+heroHeight(h);let v=h.d.jump;
  const c=ceilingAt(h.pos.x,h.pos.z,h.d.radius,top);if(c<1e8){const room=c-top-0.04;if(room<0.08)return;v=Math.min(v,Math.sqrt(2*GRAV*room));}
  h.vel.y=v;h.grounded=false;h.coyote=0;SFX.jump();}
function doSwap(pi){const p=players[pi],h=active(pi),o=other(pi);if(h.cling)return;
  h.active=false;h.following=false;h.vel.x=0;h.vel.z=0;h.guard=false;h.glide=false;
  p.act=1-p.act;o.active=true;o.following=false;G.stats.swaps++;SFX.swap();ringFx(o.pos,PCOL[pi],1.6);}
function doCall(pi){const o=other(pi),h=active(pi);if(h.cling)return;
  o.following=true;o.stuck=0;SFX.call();floatText(h.pos.clone().add(new V3(0,h.d.height+0.7,0)),'Ко мне!',PCSS[pi]);ringFx(h.pos,PCOL[pi],2);}
function updateLeftBehind(p,o,dt){const h=active(p.i);
  if(o.following&&!h.cling){const tx=h.pos.x-Math.sin(h.face)*1.6,tz=h.pos.z-Math.cos(h.face)*1.6,dx=tx-o.pos.x,dz=tz-o.pos.z,d=Math.hypot(dx,dz);
    if(d>0.9){const ux=dx/d,uz=dz/d;o.face=angDamp(o.face,Math.atan2(dx,dz),8,dt);
      // у края: узкую щель перепрыгнет сам, у широкой остановится и подождёт (не падает)
      const edge=o.grounded&&groundAt(o.pos.x+ux*0.75,o.pos.z+uz*0.75,o.pos.y+STEP).y<o.pos.y-1.2;
      if(edge){const far=groundAt(o.pos.x+ux*2.3,o.pos.z+uz*2.3,o.pos.y+STEP).y;if(far>o.pos.y-0.6&&far<o.pos.y+0.4){o.vel.x=ux*o.d.speed;o.vel.z=uz*o.d.speed;o.vel.y=o.d.jump;o.grounded=false;}else{o.vel.x=0;o.vel.z=0;}}
      else moveHero(o,dt,ux,uz,Math.min(o.d.speed*1.08,2+d*1.6));
      if(o.blocked&&o.grounded&&d>1.4&&Math.random()<0.1){o.vel.y=o.d.jump;o.grounded=false;}}
    else moveHero(o,dt,0,0,0);
    const real=o.px===undefined?9:Math.hypot(o.pos.x-o.px,o.pos.z-o.pz)/Math.max(dt,1e-3);o.px=o.pos.x;o.pz=o.pos.z;  // реальная скорость: упёрся в стену — «застрял»
    if(d>1.6&&real<0.7)o.stuck+=dt;else o.stuck=Math.max(0,o.stuck-dt);
    if((o.stuck>2.5||d>26)&&!pathBlocked(o.pos,h.pos))teleportBehind(o,h);
    else if(o.stuck>2.5&&!o.warned){o.warned=true;tip(p.i,'Второму герою путь закрыт — открой проход',2.2);}
    if(o.stuck<0.5)o.warned=false;}
  else{moveHero(o,dt,0,0,0);o.px=undefined;
    // отстал больше чем на 30 м и ничего не держит — подсказчик переносит его к управляемому
    if(!G.cine&&!G.trans&&!o.held&&!h.cling&&h.grounded&&hd(o.pos,h.pos)>30&&!pathBlocked(o.pos,h.pos)){teleportBehind(o,h);G.stats.carries++;floatText(o.pos.clone().add(new V3(0,o.d.height+0.6,0)),'Звенышко подтянуло!','#ffd76a');}}}
/* «Держись за меня»: герой цепляется за героя напарника до следующего колокольчика */
function startCling(pi,h){const c=active(1-pi);players[pi].clingOffer=false;if(c.cling)return;h.cling=true;h.clingBell=players[pi].cpBell;G.stats.clings++;SFX.ok();
  floatText(h.pos.clone().add(new V3(0,h.d.height+0.6,0)),'Держусь!',PCSS[pi]);tip(pi,'Держишься за друга до следующего колокольчика',2.6);tip(1-pi,'Друг держится за тебя — донеси до колокольчика!',2.6);}
function updateCling(pi,h){const c=active(1-pi);h.pos.set(c.pos.x-Math.sin(c.face)*0.3,c.pos.y+heroHeight(c)*0.72,c.pos.z-Math.cos(c.face)*0.3);h.vel.set(0,0,0);h.face=c.face;h.grounded=true;h.groundRef=null;
  for(const b of W.bells){if(b===h.clingBell)continue;if(hd(c.pos,b)<2.6){h.cling=false;placeOnGround(h,c.pos.x+1.0,c.pos.z+0.7,c.pos.y);floatText(h.pos.clone().add(new V3(0,h.d.height+0.5,0)),'Спасибо!',PCSS[pi]);
    const o=other(pi);if(hd(o.pos,h.pos)>12){teleportBehind(o,h);o.following=false;}   // «Держись за меня» — пропуск трудного места: второй герой пары тоже здесь
    break;}}}
function doSkill(pi,h){const p=players[pi];
  if(h.kind==='proshka'){if(h.skillCd>0)return;h.skillCd=0.5;shootAcorn(h,findMark(h));return;}
  if(h.kind==='yosha'){if(h.skillCd>0)return;h.skillCd=0.8;ladle(h);return;}
  if(p.lockedTip<=0){p.lockedTip=5;SFX.miss();floatText(h.pos.clone().add(new V3(0,h.d.height+0.5,0)),'Ещё не умею!',PCSS[pi]);
    tip(pi,(h.kind==='potap'?'Подкидка Потапа':'Совиный взор Пелагеи')+' откроется в Дремучем лесу. Свой приём сейчас — у '+(pi?'Йоши':'Прошки'),3);}}
/* RT Прошки — рогатка: жёлудь летит сам в ближайшую метку-жёлудь */
function findMark(h){let best=null,bd=1e9;const fx=Math.sin(h.face),fz=Math.cos(h.face);
  for(const m of W.marks){if(!m.active())continue;const dx=m.pos.x-h.pos.x,dz=m.pos.z-h.pos.z,d=Math.hypot(dx,dz);if(d>14)continue;if(d>4&&(dx*fx+dz*fz)/d<-0.3)continue;if(d<bd){bd=d;best=m;}}return best;}

function updateRig(i,dt){const h=active(i),r=rigs[i],back=camBack();
  r.la.x=damp(r.la.x,clamp(h.vel.x*0.45,-2.5,2.5),2.2,dt);r.la.z=damp(r.la.z,clamp(h.vel.z*0.45,-2.5,2.5),2.2,dt);

    else{shared.pos.lerp(c.camPos,1-Math.exp(-c.camK*dt));shared.look.lerp(c.camLook,1-Math.exp(-c.camK*1.3*dt));}shared.roll=damp(shared.roll,0,3,dt);return;}

    if(F.stage==='free'&&!F.rushnik){for(const pi of[0,1]){const h=active(pi);if(h.pos.z<-17.2&&tap(pi,'jump')){F.rushnik=true;SFX.whoosh();map.visible=true;anim(1.4,k=>{map.scale.z=Math.max(0.01,smooth(k));});
        later(1.5,()=>{SFX.ok();banner('Карта-рушник','#ffd76a',2.6,'Мир 1 — Дремучий лес: туда и полетит Звенышко');});later(4.6,()=>endGame());break;}}}});
  prompt(0,'jump',()=>headOf(active(0)),()=>F.stage==='free'&&!F.rushnik&&active(0).pos.z<-17.2,'карта');prompt(1,'jump',()=>headOf(active(1)),()=>F.stage==='free'&&!F.rushnik&&active(1).pos.z<-17.2,'карта');
  for(const pi of[0,1])W.objectives[pi]=[O(()=>'Лукоморье! Погуляйте. У моря — карта-рушник: подойдите и жмите '+K(pi,'jump'),()=>F.rushnik,()=>[rush[2]]),O('Рушник раскатывается…',()=>false,()=>[])];
  W.spawns=[[new V3(-4.4,0,4.4),new V3(-2.2,0,5.4)],[new V3(2.2,0,5.4),new V3(4.4,0,4.4)]];W.startAct=[players[0].act,players[1].act];
  W.pauseLine='Звенышко привело нас на Лукоморье. Дуб стоит пустой — цепь сорвана. Кот сказал присказку, которую никто не понял.';
  W.onStart=()=>lukoScene();
  flushDecor();}
function lukoScene(){const Z=W.zven,kot=W.kot,F=W.flags,T=HERO;const faceTo=(h,x,z)=>{h.face=Math.atan2(x-h.pos.x,z-h.pos.z);};
  play({dur:24.5,fov:50,
   shots:[shot(0,[0,5.2,17],[0,2.4,3]),shot(3.0,[-4.2,2.4,4.4],[0,7,-7],[-2.8,2.0,2.8],[0,3.4,-7],2.4),shot(5.4,[3.9,1.9,-1.3],[2.3,1.75,-4.6]),
     shot(11.6,[0.3,2.1,10.4],[0,1.0,4.6]),shot(16.2,[4.1,2.0,-1.0],[2.3,1.7,-4.6]),shot(20.2,[0,4.6,9.5],[0,3.6,-7])],
   says:[[7.0,4.6,'kot','Звено куют руками, а держится оно словом.'],[12.2,2.4,'proshka','<i>(шёпотом)</i> Это он про что?'],[16.6,3.6,'kot','Старая кузнечная присказка. Не обращайте внимания.']],
   events:[{t:0,fn:()=>{HEROES.forEach((h,i)=>{h.pos.y=6.5+i*0.7;h.vel.set(0,0,0);h.grounded=false;h.face=Math.PI;});kot.head.rotation.x=0.4;kot.lids.forEach(l=>{l.rotation.x=1.3;});}},
     {t:1.1,fn:()=>{SFX.thud();shakeAll(0.03,0.2);HEROES.forEach(h=>burst(new V3(h.pos.x,0.2,h.pos.z),0xd8c8a0,6,2));}},
     {t:3.0,fn:()=>HEROES.forEach(h=>faceTo(h,0,-7))},
     {t:5.4,fn:()=>{F.eyes=true;kot.lids.forEach(l=>anim(1.2,k=>{l.rotation.x=lerp(1.3,-0.5,smooth(k));}));}},
     {t:11.6,fn:()=>HEROES.forEach(h=>faceTo(h,2.3,-4.6))},
     {t:12.2,fn:()=>faceTo(T.proshka,T.potap.pos.x,T.potap.pos.z)},
     {t:14.6,fn:()=>{SFX.wave();faceTo(T.potap,T.proshka.pos.x,T.proshka.pos.z);faceTo(T.pelageya,T.yosha.pos.x,T.yosha.pos.z);faceTo(T.yosha,T.pelageya.pos.x,T.pelageya.pos.z);
       floatText(T.pelageya.pos.clone().add(new V3(0,1.7,0)),'?','#e7c3ff');floatText(T.potap.pos.clone().add(new V3(0,2.2,0)),'?','#e0b27a');floatText(T.yosha.pos.clone().add(new V3(0,1.3,0)),'?','#8fe0d4');}},
     {t:20.4,fn:()=>{zvenRing();G.links=1;banner('Звено 1 — Звенышко','#ffd76a',2.6,'первое звено цепи, выкованное самим Котом');}}],
   tick:(t,dt)=>{kot.head.rotation.x=lerp(0.4,-0.05,smooth((t-5.4)/1.6));
     if(t<4)Z.pos.lerpVectors(new V3(0,9,3),new V3(0.8,2.4,1.6),smooth(t/4));
     else if(t<20.2)Z.pos.set(0.8+Math.sin(t*0.9)*0.3,2.4,1.6);
     else{const a=(t-20.2)*2.2;Z.pos.set(Math.sin(a)*2.6,3.2+Math.sin(a*0.5)*0.4,-7+Math.cos(a)*2.6);}},
   end:()=>{F.stage='free';Z.mode='lead';kot.head.rotation.x=-0.05;kot.lids.forEach(l=>{l.rotation.x=-0.5;});snapCams();}});}

const LEVELS=[buildPrologue,buildLukomorye];

/* ============================== ПОТОК ИГРЫ ============================== */
function loadLevel(i){G.levelIdx=i;newWorld();LEVELS[i]();
  for(const pi of[0,1]){const p=players[pi];p.act=W.startAct[pi];p.petals=3;p.obj=0;p.idle=0;p.pulsed=[];p.tipT=0;p.clingOffer=false;p.falls=[];p.spirit=1;p.spiritLock=0;p.cpBell=null;
    p.heroes.forEach((h,k)=>{h.active=k===p.act;h.following=false;h.cling=false;h.iT=0;h.knockT=0;h.guard=false;h.glide=false;h.extraY=0;h.body.position.set(0,0,0);
      h.face=W.spawnFace?W.spawnFace[pi][k]:Math.PI;const s=W.spawns[pi][k];placeOnGround(h,s.x,s.z,s.y||0);});
    const s0=W.spawns[pi][p.act];p.cp.set(s0.x,s0.y||0,s0.z);hideGhost(pi);}
  G.split=0;G.splitTarget=0;G.cine=null;G.skipT=0;subT=0;snapCams();$('flash').style.opacity=0;
  if(G.state==='play')showTitle();
  if(W.onStart)W.onStart();}
function completeLevel(){if(G.trans)return;G.trans={t:0,done:false};}
function updateTrans(dt){const T=G.trans;if(!T)return;T.t+=dt;$('fade').style.opacity=T.t<0.8?T.t/0.8:Math.max(0,1-(T.t-0.8)/0.8);
  if(T.t>0.8&&!T.done){T.done=true;if(G.levelIdx+1<LEVELS.length)loadLevel(G.levelIdx+1);else endGame();}if(T.t>1.6){G.trans=null;$('fade').style.opacity=0;}}
function step(dt){G.time+=dt;G.playTime+=dt;
  if(G.cine){const c=G.cine;c.t+=dt;c.update(c.t,dt);
    if(c.skippable&&c.t>0.8){if(btn(0,'jump')&&btn(1,'jump'))G.skipT+=dt;else G.skipT=Math.max(0,G.skipT-dt*2);if(G.skipT>=1){G.skipT=0;c.skip();c.t=c.dur;}}
    if(c.t>=c.dur&&G.cine===c){G.cine=null;G.skipT=0;c.end();}}
  HEROES.forEach(h=>tickHero(h,dt));
  for(const pi of[0,1])updatePlayer(pi,dt);
  for(const h of HEROES)if(!h.cling)integrate(h,dt);
  updateWorldObjects(dt);for(const e of W.enemies.slice())updateMorok(e,dt);
  updateShots(dt);updateSparks(dt);updateTimers(dt);updateAnims(dt);updateDebris(dt);
  for(const u of W.updates)u(dt);
  updateZven(dt);updateObjectives(dt);updateGhosts(dt);updateFx(dt);
  for(const h of HEROES)animHero(h,dt);
  updateRig(0,dt);updateRig(1,dt);updateShared(dt);decideSplit(dt);updateTrans(dt);}
function menuHTML(mode){const row=(pi,a,t,later)=>'<tr'+(later?' class="later"':'')+'><td>'+t+'</td><td>'+(a==='move'?MOVEK(pi):K(pi,a))+'</td></tr>';
  const col=pi=>'<div class="col p'+(pi+1)+'"><h2 style="color:'+PCSS[pi]+'">Игрок '+(pi+1)+' · '+(pi?'Пелагея и Йоша':'Прошка и Потап')+'</h2><table>'+
   row(pi,'move','Ходьба')+row(pi,'jump',pi?'Прыжок (держи — Пелагея планирует)':'Прыжок (Прошка — выше всех)')+row(pi,'swap','Смена героя')+
   row(pi,'skill',pi?'Свой приём (Йоша — ковшик живой воды)':'Свой приём (Прошка — рогатка)')+row(pi,'guard','Защита')+row(pi,'attack','Удар')+row(pi,'call','«Ко мне!»')+
   row(pi,'item','Чудо-вещь — откроется в 1-1',true)+row(pi,'roll','Кувырок — откроется в 1-2',true)+'</table></div>';
  let top='<h1>Златая цепь</h1><div class="sub">Пролог «Звенышко» · 3D greybox · кооператив на двоих (клавиатура и/или два джойстика)</div><div class="epi">У лукоморья дуб зелёный; златая цепь на дубе том…</div>';
  if(mode==='end'){const s=G.stats,m=Math.floor(G.playTime/60),sec=Math.floor(G.playTime%60);
    return top+'<h2 style="color:#ffc93c">Пролог пройден! Звенья: '+Math.max(1,G.links)+' (Звенышко)</h2><div class="res">Время: '+m+' мин '+sec+' с'+(s.skips?' · пропущено роликов: '+s.skips:'')+
      '<br>Щитов: '+s.shields+' · Отбивов: '+s.parries+' · «Одним махом»: '+s.mahs+' · Добивающих махов: '+s.finishers+' · Искр собрано: '+s.sparks+
      '<br>Смен героя: '+s.swaps+' · Падений (без урона): '+s.falls+' · «Держись за меня»: '+s.clings+' · Звенышко подтянуло оставленных: '+s.carries+
      '<br><span style="opacity:.8">Дальше по сценарию — Мир 1 «Дремучий лес», уровень 1-1 «Избушка, повернись» (он есть в вертикальном срезе).</span></div><div class="go">Enter или Start — сыграть снова</div>';}
  const padRows=[[STICK,'Ходьба'],[padGlyph('jump'),'Прыжок (держать — планировать)'],[padGlyph('swap'),'Смена героя'],[padGlyph('skill'),'Свой приём'],[padGlyph('guard'),'Защита'],[padGlyph('attack'),'Удар'],
    [padGlyph('call'),'«Ко мне!»'],['<span class="pb T">Start</span>','Пауза / начать'],[padGlyph('item')+padGlyph('roll'),'<span style="opacity:.5">Чудо-вещь (1-1) · Кувырок (1-2)</span>']];
  const padCol='<div class="col" style="border:3px solid #56607a;margin-top:14px"><h2>Джойстики · раскладка по сценарию v4 (Xbox / PlayStation)</h2><div class="padgrid">'+padRows.map(r=>'<div>'+r[0]+' '+r[1]+'</div>').join('')+'</div><div style="margin-top:8px;font-size:13px;opacity:.85">'+padStatus()+'</div></div>';
  const pbtn=pi=>{const p=players[pi];return '<button id="e'+pi+'" class="'+p.path+'">Игрок '+(pi+1)+': '+PATHNAME[p.path]+' <kbd>'+(pi?'K':'Q')+'</kbd></button>';};
  return top+(mode==='pause'&&W&&W.pauseLine?'<div class="legend"><div style="flex:1"><b>Что мы делаем:</b> '+W.pauseLine+'</div></div>':'')+'<div class="cols">'+col(0)+col(1)+'</div>'+padCol+
   '<div class="legend"><div><i class="sg y"></i> солнышко над мороком — Защита: раньше — щит, позже — отбив, в самый миг — «Одним махом»</div><div>угольки <i class="sg e"></i> погасли — Пробой → Удар: Добивающий мах</div>'+
   '<div><i class="sg o"></i> жёлтая плита с лапкой — встать любому; ворота открыты, пока плиту держат</div><div>над героем картинка кнопки — жми её этим героем</div><div>ролик: оба держат прыжок — пропуск</div></div>'+
   '<div class="diff">'+pbtn(0)+pbtn(1)+'<button id="subsb">Субтитры: '+(G.subs?'вкл':'выкл')+' <kbd>C</kbd></button></div>'+
   '<div class="go">'+(mode==='pause'?'Enter / Esc / Start — продолжить':'Enter или Start — начать')+'</div>';}
function cyclePath(pi){const p=players[pi];p.path=PATHS[(PATHS.indexOf(p.path)+1)%3];}
function showMenu(mode){G.state=mode;const card=$('card');card.innerHTML=menuHTML(mode);$('menu').classList.remove('hide');
  for(const pi of[0,1]){const b=$('e'+pi);if(b)b.onclick=()=>{cyclePath(pi);showMenu(mode);};}const sb=$('subsb');if(sb)sb.onclick=()=>{G.subs=!G.subs;showMenu(mode);};}
function showTitle(){const lv=$('level');lv.innerHTML=W.name+'<br><span style="font-size:18px;font-weight:600;opacity:.85">'+W.sub+'</span>';lv.style.opacity=1;clearTimeout(showTitle.t);showTitle.t=setTimeout(()=>{lv.style.opacity=0;},3600);}
function hideMenu(){const first=G.state!=='pause';$('menu').classList.add('hide');G.state='play';initAudio();if(first)showTitle();}
function endGame(){showMenu('end');}
function restart(){for(const k in G.stats)G.stats[k]=0;G.playTime=0;G.links=0;players.forEach(p=>{p.enc=0;p.shieldTaught=false;p.closedTaught=false;p.staggerSeen=0;});loadLevel(0);hideMenu();}
function menuInput(){if(G.state==='end'){if(pressed.has('Enter'))restart();return;}
  if(pressed.has('Tab')||pressed.has('PadBack')){PADS.swap=!PADS.swap;showMenu(G.state);}if(pressed.has('KeyQ')){cyclePath(0);showMenu(G.state);}if(pressed.has('KeyK')){cyclePath(1);showMenu(G.state);}
  if(pressed.has('KeyC')){G.subs=!G.subs;showMenu(G.state);}
  if(pressed.has('Enter')||(G.state==='pause'&&pressed.has('Escape')))hideMenu();}
let last=performance.now();
function frame(now){requestAnimationFrame(frame);let dt=Math.min(0.05,(now-last)/1000);last=now;pollPads();
  if(G.state==='play'&&G.manual){}else if(G.state==='play'){if(pressed.has('Escape')){showMenu('pause');}else{if(G.hitstop>0){G.hitstop-=dt;dt*=0.15;}step(dt);}}else menuInput();
  render();updateUI(Math.min(0.05,G.state==='play'?dt:0));pressed.clear();}
hudInit();loadLevel(0);showMenu('menu');requestAnimationFrame(frame);
window.ZC={G,players,loadLevel,HERO,get W(){return W;},step,completeLevel,
  sim(sec){const n=Math.round(sec*60);for(let i=0;i<n;i++){if(G.state!=='play')break;step(1/60);if(i%30===0)updateUI(1/60);pressed.clear();}render();updateUI(1/60);},
  start(){hideMenu();},menu:showMenu,tick(n){for(let i=0;i<(n||1);i++){step(1/60);pressed.clear();}},press(c){pressed.add(c);},hold(c,on){if(on)down.add(c);else down.delete(c);},skip(){if(G.cine){G.cine.skip();G.cine.t=G.cine.dur;}}};
})();
</script>
