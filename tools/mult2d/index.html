<!doctype html>
<!-- Съёмочная страница 2D-сериала: ?ep=proba. Кадр рисует MD.render(t); shoot.js снимает покадрово, без &shoot — предпросмотр в реальном времени.
     Открывать через локальный сервер (спрайты и метки рта грузятся fetch): python3 -m http.server -d tools/mult2d -->
<meta charset="utf-8">
<title>Златая цепь 2D</title>
<style>
@font-face{font-family:"Ruslan Display";src:url(fonts/RuslanDisplay-Regular.ttf)}
@font-face{font-family:Rubik;src:url(fonts/Rubik.ttf);font-weight:300 900}
@font-face{font-family:Alegreya;src:url(fonts/Alegreya.ttf);font-weight:400 900}
html,body{margin:0;background:#111;height:100%}
canvas{display:block;height:100vh;margin:0 auto}
</style>
<canvas id="c"></canvas>
<script src="engine.js"></script>
<script src="cast.js"></script>
<script src="pup.js"></script>
<script src="sets.js"></script>
<script src="anim.js"></script>
<script src="ep_proba.js"></script>
<script src="ep_kukly.js"></script>
<script src="ep_ser01.js"></script>
<script src="ser01_1.js"></script>
<script src="ser01_2.js"></script>
<script src="ser01_3.js"></script>
<script src="ser01_4.js"></script>
<script src="ep_s4.js"></script>
<script src="s4_1.js"></script>
<script src="s4_2.js"></script>
<script src="s4_3.js"></script>
<script src="s4_4.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search), id = q.get('ep') || 'proba';
  await Promise.all(['56px "Ruslan Display"', '500 54px Rubik', '700 54px Rubik', '54px Alegreya'].map(f => document.fonts.load(f, 'АБВ')));
  MD.init(id);
  await MD.loadSprites();
  if (MD.ep.voice) await MD.loadLips(MD.ep.voiceDir + '/lips', MD.ep.voice.map(v => v.id));
  window.READY = true;
  if (q.has('shoot')) return;
  const t0 = performance.now(), loop = () => { MD.render(((performance.now() - t0) / 1000) % MD.ep.dur); requestAnimationFrame(loop); }; loop();
})();
</script>
